  <style id="hn-style">
  :root {
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #E9BE82; --paper: #F7E6C2; --paper-edge: #D3A96C; --field: #FFF7E3;
    --ink: #2A1B12; --ink-soft: #684931; --line: rgba(42,27,18,.2);
    --night: #14232A; --night-ink: #EBD9B4; --gold: #F2C14E;
    --red: #B3372B; --on-red: #FFF4E0; --pine: #2D6A55;
    --tape: rgba(242,193,78,.62);
    --shadow: 0 2px 0 rgba(42,27,18,.12),0 12px 24px -14px rgba(42,27,18,.55);
    --sky1: #0F1C28; --sky2: #1B3A3C; --p1: #1D4B42; --p2: #143832; --p3: #0B2523;
    --f-display: 'Metamorphous', Georgia, 'Times New Roman', serif;
    --f-ui: 'Nunito', system-ui, -apple-system, sans-serif;
    --f-read: 'Literata', Georgia, 'Times New Roman', serif;
    --f-hand: 'Caveat', 'Segoe Print', cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17110D; --paper: #261C14; --paper-edge: #46341F; --field: #1D1510;
      --ink: #F2E0BC; --ink-soft: #BFA27C; --line: rgba(242,224,188,.2);
      --night: #0B1418; --red: #E2604F; --on-red: #1A0F0B; --pine: #6CC0A5;
      --tape: rgba(242,193,78,.34);
      --shadow: 0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17110D; --paper: #261C14; --paper-edge: #46341F; --field: #1D1510;
    --ink: #F2E0BC; --ink-soft: #BFA27C; --line: rgba(242,224,188,.2);
    --night: #0B1418; --red: #E2604F; --on-red: #1A0F0B; --pine: #6CC0A5;
    --tape: rgba(242,193,78,.34);
    --shadow: 0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font: 400 16px/1.55 var(--f-ui);
    background: var(--bg); color: var(--ink);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background-image: radial-gradient(circle at 20% 0%, rgba(255,255,255,.14), transparent 45%), radial-gradient(circle at 90% 100%, rgba(0,0,0,.12), transparent 40%);
    background-attachment: fixed;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; }
  p { margin: 0; }
  .shell { max-width: 1120px; margin: 0 auto; }
  .hand { font-family: var(--f-hand); font-weight: 700; font-size: 1.3em; line-height: 1.1; }
  .kicker { font: 800 .72rem/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
  .num { font-variant-numeric: tabular-nums; }

  /* Topbar & Dropdown */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-top: 12px; max-width: 1120px; margin: 0 auto; }
  .bar { position: relative; display: flex; align-items: center; gap: 8px; background: var(--night); color: var(--night-ink); border-radius: 16px; padding: 6px 10px; box-shadow: var(--shadow); }
  .brand { display: block; flex: none; padding: 4px 6px; }
  .brand img { display: block; height: 38px; width: auto; max-width: 180px; object-fit: contain; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; padding: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px; color: var(--night-ink); text-decoration: none; font: 700 .88rem/1 var(--f-ui); white-space: nowrap; transition: background .15s; }
  .tab svg { width: 18px; height: 18px; flex: none; }
  .tab:hover { background: rgba(255,255,255,.08); }
  .tab[aria-current="page"] { background: rgba(242,193,78,.18); color: var(--gold); }
  .adm { flex: none; display: flex; align-items: center; gap: 6px; border: 1.5px solid rgba(235,217,180,.4); background: transparent; color: var(--night-ink); border-radius: 999px; padding: 7px 12px; font: 800 .78rem/1 var(--f-ui); }
  .adm svg { width: 16px; height: 16px; }
  .adm[aria-pressed="true"] { background: var(--gold); color: #1B1208; border-color: var(--gold); }
  .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); width: 0; }

  /* Dropdown 3 Titik */
  .dropdown-wrap { position: relative; display: inline-block; flex: none; }
  .dots-btn { min-width: 36px; height: 36px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  .dropdown-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 230px; background: var(--night); color: var(--night-ink); border: 1.5px solid var(--gold); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); z-index: 100; overflow: hidden; display: flex; flex-direction: column; padding: 6px 0; }
  .dropdown-menu[hidden] { display: none !important; }
  .dropdown-menu button { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: transparent; border: 0; color: var(--night-ink); font: 700 0.88rem/1 var(--f-ui); text-align: left; width: 100%; transition: background 0.15s; }
  .dropdown-menu button:hover { background: rgba(242,193,78,0.18); color: var(--gold); }
  .dropdown-menu button svg { width: 18px; height: 18px; flex: none; }

  main.shell { padding-block: 22px 28px; }
