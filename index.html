function valid(r){
  if(TABS.some(function(t){return t[0]===r}))return true;
  if(r==='nbaru')return true;
  if(r==='tulis')return true;
  if(/^nubah-[A-Za-z0-9_-]+$/.test(r))return S.novels.some(function(n){return 'nubah-'+n.id===r});
  if(/^n-[A-Za-z0-9_-]+$/.test(r))return S.novels.some(function(n){return 'n-'+n.id===r});
  if(/^tulis-[A-Za-z0-9_-]+$/.test(r))return S.chapters.some(function(c){return 'tulis-'+c.id===r});
  if(/^b-[A-Za-z0-9_-]+$/.test(r))return S.chapters.some(function(c){return 'b-'+c.id===r});
  if(/^e-[A-Za-z0-9_-]+$/.test(r))return S.lore.some(function(e){return 'e-'+e.id===r});
  return false;
}

function curTab(){
  if(route.indexOf('b-')===0)return 'baca';
  if(route.indexOf('n-')===0||route.indexOf('nubah-')===0||route==='nbaru')return 'baca';
  if(route.indexOf('tulis')===0)return 'baca';
  if(route.indexOf('e-')===0){var e=entry(route.slice(2));return e?TYPES[e.type].tab:'home'}

}

      <p>Edit langsung dari tiap halaman.</p>
      <div class="hn-writer-stats"><div><span>Total Chapters</span><strong id="hn-stat-total">0</strong></div><div><span>Drafts</span><strong id="hn-stat-drafts">0</strong></div><div><span>Published</span><strong id="hn-stat-published">0</strong></div></div>
      <div class="hn-author-actions"><button type="button" id="hn-author-newchapter">NEW CHAPTER</button><button type="button" id="hn-author-modetoggle">EDIT TOOLS: ON</button></div>
      <hr>
      <h3>CHAPTER ARCHIVE</h3>
      <p id="hn-chapter-message" role="status" aria-live="polite"></p>
      <div id="hn-chapter-list"><p>Chapter archive will appear here.</p></div>
      <button type="button" id="hn-author-logout">SIGN OUT</button>
    </div>
  </section>
</div>
<script>
(function(){
  var AUTHOR_UID='6c3958f1-ee85-47e6-836a-f1db260bc3cc';
  var db=window.hnSupabase;
  var button=document.getElementById('hn-author-access');
  var modal=document.getElementById('hn-author-modal');
  var form=document.getElementById('hn-author-form');
  var message=document.getElementById('hn-author-message');
  var dashboard=document.getElementById('hn-author-dashboard');
  var subtitle=document.getElementById('hn-author-subtitle');
  var emailInput=document.getElementById('hn-author-email');
  var passwordInput=document.getElementById('hn-author-password');
  var chapterList=document.getElementById('hn-chapter-list');
  var toggleBtn=document.getElementById('hn-author-modetoggle');
  if(!db){button.addEventListener('click',function(){alert('Supabase belum siap.');});return}
  function api(){return window.hnApp}
  function escapeHTML(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function syncToggle(){var on=api()&&api().isAdmin();toggleBtn.textContent=on?'EDIT TOOLS: ON':'EDIT TOOLS: OFF'}
  function renderArchive(){
    var app=api();if(!app){chapterList.innerHTML='<p>Memuat chapter...</p>';return}
    var chapters=app.chapters();
    document.getElementById('hn-stat-total').textContent=chapters.length;
    document.getElementById('hn-stat-drafts').textContent=chapters.filter(function(c){return c.status==='draft'}).length;
    document.getElementById('hn-stat-published').textContent=chapters.filter(function(c){return c.status==='published'}).length;
    syncToggle();
    if(!chapters.length){chapterList.innerHTML='<p>Belum ada chapter.</p>';return}
    var html='';
    chapters.forEach(function(c){
      html+='<article class="hn-chapter-card"><h4>'+escapeHTML(c.title)+'</h4><p>'+escapeHTML(c.vol||'No volume')+(c.n?' - Chapter '+escapeHTML(c.n):'')+'</p><p>Status: <strong>'+(c.status==='draft'?'draft':'published')+'</strong></p><div class="hn-author-actions"><button type="button" data-hn-act="edit" data-id="'+escapeHTML(c.id)+'">EDIT ISI</button><button type="button" data-hn-act="identity" data-id="'+escapeHTML(c.id)+'">UBAH BAB</button><button type="button" data-hn-act="pub" data-id="'+escapeHTML(c.id)+'">'+(c.status==='draft'?'PUBLISH':'UNPUBLISH')+'</button><button type="button" data-hn-act="del" data-id="'+escapeHTML(c.id)+'">DELETE</button></div></article>';
    });
    chapterList.innerHTML=html;
  }
  function showLoggedOut(){form.hidden=false;dashboard.hidden=true;subtitle.textContent='AUTHOR ARCHIVE // RESTRICTED ACCESS';button.textContent='AUTHOR ACCESS';passwordInput.value=''}
  function updateSessionUI(){
    db.auth.getSession().then(function(r){
      var user=r&&r.data&&r.data.session&&r.data.session.user;
      if(user&&user.id===AUTHOR_UID){form.hidden=true;dashboard.hidden=false;subtitle.textContent='IDENTITY VERIFIED';button.textContent='AUTHOR MODE';message.textContent='Akun Author berhasil diverifikasi.';renderArchive()}
      else showLoggedOut();
    }).catch(function(){showLoggedOut()});
  }
  button.addEventListener('click',function(){modal.hidden=false;updateSessionUI()});
  document.getElementById('hn-author-close').addEventListener('click',function(){modal.hidden=true});
  modal.addEventListener('click',function(e){if(e.target===modal)modal.hidden=true});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=emailInput.value.trim(),password=passwordInput.value;
    message.textContent='Memverifikasi identitas...';
    db.auth.signInWithPassword({email:email,password:password}).then(function(r){
      var data=r.data,error=r.error;
      if(error){message.textContent='Login gagal. Periksa email & password.';return}
      if(!data.user||data.user.id!==AUTHOR_UID){db.auth.signOut();showLoggedOut();message.textContent='Akses ditolak.';return}
      passwordInput.value='';
      message.textContent='Identitas berhasil diverifikasi.';
      updateSessionUI();
    });
  });
  document.getElementById('hn-author-logout').addEventListener('click',function(){
    message.textContent='Keluar...';
    db.auth.signOut({scope:'local'}).then(function(){try{Object.keys(localStorage).filter(function(k){return /^sb-.*-auth-token/.test(k)}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}showLoggedOut();message.textContent='Kamu sudah keluar.';location.reload()}).catch(function(){showLoggedOut();location.reload()});
  });
  document.getElementById('hn-author-newchapter').addEventListener('click',function(){modal.hidden=true;if(api())api().create()});
  toggleBtn.addEventListener('click',function(){if(api())api().toggleAdmin();syncToggle()});
  chapterList.addEventListener('click',function(e){
    var b=e.target.closest('[data-hn-act]');if(!b||!api())return;
    var id=b.dataset.id,act=b.dataset.hnAct;
    if(act==='edit'){modal.hidden=true;api().edit(id)}
    else if(act==='identity'){modal.hidden=true;api().editIdentity(id)}
    else if(act==='pub'){api().togglePublish(id)}
    else if(act==='del'){if(confirm('Hapus chapter ini secara permanen?'))api().remove(id)}
  });
  document.addEventListener('hn-state',function(){
    var isAuthor=!!(api()&&api().isAuthor());
    button.textContent=isAuthor?'AUTHOR MODE':'AUTHOR ACCESS';
    if(!dashboard.hidden){if(isAuthor)renderArchive();else showLoggedOut()}
  });
})();
</script>
</body></html>
