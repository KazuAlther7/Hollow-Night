<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hollow Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Metamorphous&family=Nunito:wght@400;600;700;800&display=swap">
<style id="hn-style">
/* Layout: a journal desk. A floating night-blue tab bar sits over a tan desk; the home page opens on a pine-forest night scene with the logo, inner pages are paper sheets taped to the desk. */
:root{
  --bg:#E9BE82; --paper:#F7E6C2; --paper-edge:#D3A96C; --field:#FFF7E3;
  --ink:#2A1B12; --ink-soft:#684931; --line:rgba(42,27,18,.2);
  --night:#14232A; --night-ink:#EBD9B4; --gold:#F2C14E;
  --red:#B3372B; --on-red:#FFF4E0; --pine:#2D6A55;
  --tape:rgba(242,193,78,.62);
  --shadow:0 2px 0 rgba(42,27,18,.12),0 12px 24px -14px rgba(42,27,18,.55);
  --sky1:#0F1C28; --sky2:#1B3A3C; --p1:#1D4B42; --p2:#143832; --p3:#0B2523;
  --f-display:'Metamorphous',Georgia,'Times New Roman',serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-read:'Literata',Georgia,'Times New Roman',serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
    --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
    --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
    --tape:rgba(242,193,78,.34);
    --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
  --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
  --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
  --tape:rgba(242,193,78,.34);
  --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-ui);
  padding-block:0 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.14),transparent 45%),radial-gradient(circle at 90% 100%,rgba(0,0,0,.12),transparent 40%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-weight:700;font-size:1.3em;line-height:1.1}
.kicker{font:800 .72rem/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:12px;max-width:1120px;margin:0 auto}
.bar{position:relative;display:flex;align-items:center;gap:8px;background:var(--night);color:var(--night-ink);border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);overflow:hidden}
.brand{display:block;flex:none;padding:4px 6px}
.brand img{display:block;height:34px;width:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;color:var(--night-ink);text-decoration:none;font:700 .88rem/1 var(--f-ui);white-space:nowrap;transition:background .15s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{background:rgba(242,193,78,.18);color:var(--gold)}
.adm{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(235,217,180,.4);background:transparent;color:var(--night-ink);border-radius:999px;padding:7px 12px;font:800 .78rem/1 var(--f-ui)}
.adm svg{width:16px;height:16px}
.adm[aria-pressed="true"]{background:var(--gold);color:#1B1208;border-color:var(--gold)}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0}
@media (max-width:760px){
  .bar{flex-wrap:wrap}
  .tabs{order:3;flex:1 0 100%}
  .brand{margin-right:auto}
  .brand img{height:30px}
}

main.shell{padding-block:22px 28px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border-radius:10px;border:2px solid transparent;font:800 .92rem/1.1 var(--f-ui);text-decoration:none;background:var(--red);color:var(--on-red);box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:#1B1208}
.btn.nightghost{background:transparent;color:var(--night-ink);border-color:rgba(235,217,180,.55);box-shadow:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.8rem}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.sheet{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:22px}
.sheet.taped::before,.card.taped::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border:1px solid rgba(0,0,0,.06)}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.ph h1{font-size:clamp(1.9rem,5vw,2.8rem);margin-top:6px}
.ph .sub{font-family:var(--f-hand);font-weight:600;font-size:1.35rem;color:var(--ink-soft);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:36px 16px}
.empty .hand{font-size:1.7rem}
.empty p{max-width:46ch;margin:8px auto 18px;color:var(--ink-soft)}
.stamp{display:inline-block;font:700 1.05rem/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:4px;padding:2px 8px;transform:rotate(-5deg);letter-spacing:.04em}
.chip{display:inline-block;font:800 .68rem/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:5px 9px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.filters .in{max-width:280px}
button.chip{background:transparent}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--night);color:var(--night-ink);box-shadow:var(--shadow);isolation:isolate}
.scene{position:absolute;inset:0;z-index:-1}
.scn{width:100%;height:100%;display:block}
.scn .l1{fill:var(--p1)}.scn .l2{fill:var(--p2)}.scn .l3{fill:var(--p3)}
.scn .gnd{fill:var(--p3)}
.ff{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:#FFE58A;box-shadow:0 0 10px 3px rgba(255,229,138,.7);animation:drift var(--t) ease-in-out var(--d) infinite}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(16px,-22px);opacity:1}}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:38px 18px 110px}
.logo-big{width:min(560px,88%);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.tag{font:700 clamp(1.3rem,3.4vw,1.8rem)/1.15 var(--f-hand);color:var(--gold);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.rollout{min-height:2.4em;font:700 1.15rem/1.2 var(--f-hand);color:var(--night-ink);max-width:40ch}
.rollout b{color:var(--gold);font-size:1.5em}
.d20{transition:transform .5s}
.d20.spin{animation:spin .7s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* home sections */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;margin-top:34px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:1.45rem}
.syn p+p{margin-top:.9em}
.syn p{font-family:var(--f-read);font-size:1.02rem;line-height:1.7}
.nb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:34px}
.nbi{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s}
.nbi:hover{transform:translateY(-3px) rotate(-.6deg)}
.nbi svg{width:30px;height:30px;color:var(--red)}
.nbi b{font:400 1.15rem/1.1 var(--f-display)}
.nbi span{font:700 1.1rem/1.1 var(--f-hand);color:var(--ink-soft)}
.desk{margin-top:26px;border-style:dashed}
.desk h2{font-size:1.25rem;margin-bottom:6px}

/* toc */
.vol{margin:26px 0 8px;font:400 1.2rem/1 var(--f-display);display:flex;align-items:center;gap:12px}
.vol::after{content:"";flex:1;border-top:2px dotted var(--ink-soft)}
.toc{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.rowlink{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-decoration:none}
.rowlink:hover .rt-title{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.hex{display:grid;place-items:center;width:44px;height:48px;background:var(--night);color:var(--gold);font:400 1.05rem/1 var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rt-title{font:400 1.12rem/1.2 var(--f-display)}
.rt-meta{font:600 .82rem/1.3 var(--f-ui);color:var(--ink-soft);margin-top:3px}
.done{font:700 1.05rem/1 var(--f-hand);color:var(--pine)}
.rowact{display:flex;gap:6px;padding-right:12px;flex-wrap:wrap}
@media (max-width:520px){.row{flex-wrap:wrap}.rowact{padding:0 16px 12px}}

/* reader */
.rd-wrap{max-width:720px;margin:0 auto}
.rd-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px}
.reader{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:clamp(22px,5vw,52px) clamp(18px,5vw,56px)}
.reader header{text-align:center;margin-bottom:30px}
.reader header h1{font-size:clamp(1.7rem,5vw,2.4rem);margin-top:10px}
.orn{display:block;margin:14px auto 0;width:150px;height:14px;color:var(--red)}
.body{font-family:var(--f-read);font-size:var(--fs,18px);line-height:1.85;hyphens:auto;overflow-wrap:break-word}
.body p{margin:0 0 1.05em}
.reader .body>p:first-child::first-letter{float:left;font:400 3.5em/.82 var(--f-display);padding:.07em .1em 0 0;color:var(--red)}
.body h2{font-size:1.35em;margin:1.6em 0 .6em;text-align:center}
.body h3{font-size:1.15em;margin:1.4em 0 .5em}
.body blockquote{margin:1.2em 0;padding:.2em 0 .2em 1.1em;border-left:4px solid var(--red);font-style:italic;color:var(--ink-soft)}
.body hr{border:0;height:1.6em;text-align:center;margin:1.2em 0}
.body hr::after{content:"*  *  *";letter-spacing:.4em;color:var(--red);font-family:var(--f-display)}
.body ul,.body ol{padding-left:1.4em;margin:0 0 1.05em}
.rd-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:26px}

/* lore cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);text-decoration:none;overflow:hidden;transition:transform .15s}
.grid>.card:nth-child(3n+1){transform:rotate(-.5deg)}
.grid>.card:nth-child(3n){transform:rotate(.45deg)}
.card:hover{transform:translateY(-4px) rotate(0)}
.card .ph-img{aspect-ratio:16/10;background:var(--night);display:block;width:100%;object-fit:cover}
.card .noimg{aspect-ratio:16/7;display:grid;place-items:center;background:var(--night);color:var(--gold);position:relative}
.card .noimg svg{width:38px;height:38px}
.card .cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.25rem}
.card .sum{color:var(--ink-soft);font-size:.95rem}
.card .cadm{display:flex;gap:6px;padding:0 18px 16px;flex-wrap:wrap}
.cc{padding:0}
.cc-top{display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--night);color:var(--night-ink)}
.portrait{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);background:var(--p1);display:grid;place-items:center;overflow:hidden;font:400 1.5rem/1 var(--f-display);color:var(--gold)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.cc-top h3{font-size:1.3rem}
.cc-top .hand{color:var(--gold);font-size:1.15rem}
.align{display:inline-block;font:800 .66rem/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--pine);color:#fff}
:root[data-theme="dark"] .align{color:#0B1418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .align{color:#0B1418}}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.st{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border:1.5px solid var(--ink-soft);border-radius:8px;font-variant-numeric:tabular-nums}
.st span{font:800 .6rem/1 var(--f-ui);letter-spacing:.08em;color:var(--ink-soft)}
.st b{font:400 1.15rem/1.1 var(--f-display)}
.st i{font:700 .72rem/1 var(--f-ui);font-style:normal;color:var(--red)}
.secret{position:relative;margin-top:18px;padding:16px;border:2px dashed var(--red);border-radius:8px;cursor:pointer;text-align:left;background:transparent;width:100%}
.secret .sc{filter:blur(7px);transition:filter .3s;user-select:none}
.secret .sl{position:absolute;inset:0;display:grid;place-items:center;font:700 1.2rem/1.1 var(--f-hand);color:var(--red);text-align:center;padding:8px}
.secret.on .sc{filter:none;user-select:auto}
.secret.on .sl{display:none}

/* entry detail */
.det{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.det-hero{width:100%;max-height:420px;object-fit:cover;border-radius:6px;border:1px solid var(--paper-edge);display:block}
.det h1{font-size:clamp(1.9rem,5vw,2.7rem)}
.quote{font:600 1.5rem/1.2 var(--f-hand);color:var(--ink-soft)}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:16px;font:800 .85rem/1 var(--f-ui);text-decoration:none;color:var(--ink-soft)}
.back:hover{color:var(--ink)}
.sheetc{display:flex;flex-direction:column;gap:16px}
.sheetc .cc-top{border-radius:6px}
.sheetc .portrait{width:92px;height:92px;font-size:2.2rem}
.mapwrap{position:relative;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--night);line-height:0}
.mapwrap img{width:100%;height:auto;display:block}
.mapwrap.pm{cursor:crosshair;outline:3px dashed var(--gold);outline-offset:-3px}
.pin{position:absolute;margin-top:-21px;transform:translate(-50%,-50%) rotate(-45deg);width:30px;height:30px;padding:0;border:0;background:var(--red);color:var(--on-red);font:800 .78rem/1 var(--f-ui);border-radius:50% 50% 50% 0;box-shadow:0 3px 6px rgba(0,0,0,.5);display:grid;place-items:center}
.pin span{transform:rotate(45deg);display:block}
.pin.sel{background:var(--gold);color:#1B1208;z-index:2}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.lg{display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.lg.sel{border-color:var(--red);background:rgba(179,55,43,.08)}
.lg .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;font:800 .78rem/1 var(--f-ui)}
.lg b{font:400 1.05rem/1.2 var(--f-display);display:block}
.lg small{display:block;color:var(--ink-soft);font-size:.9rem;margin-top:2px}

/* timeline & glossary */
.tl{position:relative;padding-left:34px;max-width:760px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;border-left:3px solid var(--ink)}
.ev{position:relative;margin-bottom:22px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px}
.ev::before{content:"";position:absolute;left:-31px;top:20px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--night)}
.ev .when{font:700 1.3rem/1 var(--f-hand);color:var(--red)}
.ev h3{font-size:1.2rem;margin:4px 0 6px}
.gl h2{font:700 2.2rem/1 var(--f-hand);color:var(--red);margin:24px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.gi{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
.gi>div{flex:1 1 320px;min-width:0}
.gi b{font:400 1.15rem/1.2 var(--f-display)}
.gi p{color:var(--ink);margin-top:3px}

/* forms & modal */
.in{width:100%;background:var(--field);color:var(--ink);border:1.5px solid var(--paper-edge);border-radius:8px;padding:10px 12px;font:600 1rem/1.4 var(--f-ui);min-height:42px}
textarea.in{resize:vertical;min-height:96px;font-weight:500}
select.in{appearance:auto}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>label,.f>.lb{font:800 .72rem/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.f6 .in{padding:8px 4px;text-align:center}
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,14,18,.68);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.md{background:var(--paper);color:var(--ink);width:min(760px,100%);border:1px solid var(--paper-edge);border-radius:10px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.md h2{font-size:1.5rem;margin-bottom:4px}
.md .hint{color:var(--ink-soft);font-size:.92rem;margin-bottom:16px}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:8px}
.rt{border:1.5px solid var(--paper-edge);border-radius:8px;background:var(--field);overflow:hidden}

.rtb{min-width:38px;min-height:34px;border:1.5px solid var(--paper-edge);background:var(--field);border-radius:6px;font:800 .9rem/1 var(--f-ui)}

.rt-area p{margin:0 0 .9em}
.rt-area h2{font-size:1.25rem;margin:1em 0 .4em;text-align:center}
.rt-area blockquote{margin:1em 0;padding-left:1em;border-left:4px solid var(--red);font-style:italic}
.imgf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.imgf img{width:96px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--paper-edge);background:var(--night)}
.drop{border:2px dashed var(--ink-soft);border-radius:10px;padding:26px 16px;text-align:center;background:var(--field)}
.drop .hand{font-size:1.5rem}
.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr) 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.imp-row small{grid-column:2/4;color:var(--ink-soft);font-weight:600}
.imp-list{max-height:46vh;overflow-y:auto;margin:10px 0}

.busy{position:fixed;inset:0;z-index:80;background:rgba(8,14,18,.6);display:grid;place-items:center;color:var(--night-ink);font:700 1.5rem/1.2 var(--f-hand);text-align:center;padding:20px}
.foot{max-width:1120px;margin:30px auto 24px;padding-top:18px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;color:var(--ink-soft);font-weight:600;font-size:.9rem}

}

  function pine(cx,by,h,w,c){var p=[[0,-h],[.28,-.62*h],[.14,-.62*h],[.38,-.3*h],[.2,-.3*h],[.5,0],[-.5,0],[-.2,-.3*h],[-.38,-.3*h],[-.14,-.62*h],[-.28,-.62*h]];
    return '<polygon class="'+c+'" points="'+p.map(function(q){return (cx+(q[0]*w*(Math.abs(q[0])<1?1:1))).toFixed(0)+','+(by+q[1]).toFixed(0)}).join(' ')+'"/>'}
  var x,L=[{c:'l3',step:44,h:[110,180],w:[70,90],skip:0},{c:'l2',step:66,h:[150,240],w:[84,112],skip:0},{c:'l1',step:96,h:[200,330],w:[104,140],skip:1}];
  L.forEach(function(l){for(x=-20;x<1240;x+=l.step){if(l.skip&&x>400&&x<800)continue;var h=l.h[0]+r()*(l.h[1]-l.h[0]),w=l.w[0]+r()*(l.w[1]-l.w[0]);o+=pine(x+r()*20,426,h,w,l.c)}});

  return o+f;
}

/* ---------- routing ---------- */
var TABS=[['home','Beranda','home'],['baca','Baca','book'],['dunia','Dunia','globe'],['tokoh','Tokoh','person'],['peta','Peta','map'],['lini','Lini Masa','hour'],['istilah','Istilah','scroll']];
function valid(r){
  if(TABS.some(function(t){return t[0]===r}))return true;
  if(/^b-[A-Za-z0-9_-]+$/.test(r))return S.chapters.some(function(c){return 'b-'+c.id===r});
  if(/^e-[A-Za-z0-9_-]+$/.test(r))return S.lore.some(function(e){return 'e-'+e.id===r});
  return false;
}
function go(r){
  if(!valid(r))r='home';
  pinMode=false;selPin=-1;
  try{if(location.hash.slice(1)!==r)location.hash=r}catch(e){}
  route=r;render();
}
function curTab(){
  if(route.indexOf('b-')===0)return 'baca';
  if(route.indexOf('e-')===0){var e=entry(route.slice(2));return e?TYPES[e.type].tab:'home'}
  return route;
}

function caesar(s,k){return s.replace(/[a-z]/gi,function(c){var b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+k+26)%26+b)})}

function view(){
  if(route==='home')return vHome();

function makeSlug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,120)}

  return {id:r.id,slug:r.slug,n:r.chapter_number==null?0:r.chapter_number,vol:r.volume||'',title:r.title,body:body,status:r.status==='published'?'published':'draft',t:Date.parse(r.created_at)||0};
}
function notify(){try{document.dispatchEvent(new CustomEvent('hn-state'))}catch(e){}}
async function loadContent(){
  if(!db)return;
  try{
    var sq=await db.from('hn_site').select('data').eq('id','main').maybeSingle();
    var q=db.from('chapters').select('id,title,slug,volume,chapter_number,content,status,created_at').order('created_at',{ascending:true});
    if(!canEdit)q=q.eq('status','published');
    var cq=await q;
    if(sq.error)console.warn('hn_site:',sq.error.message);
    if(cq.error)console.warn('chapters:',cq.error.message);
    var hasRow=!!(sq.data&&sq.data.data);
    if(hasRow){var d=sq.data.data;S.site=d.site||{tagline:'',synopsis:'',author:''};S.lore=d.lore||[]}
    if(!cq.error){
      var rows=cq.data||[];dbIds={};rows.forEach(function(r){dbIds[r.id]=1});
      if(rows.length||hasRow)S.chapters=rows.map(rowToCh);
    }
    dbLoaded=!sq.error&&!cq.error;
  }catch(e){console.error(e);dbLoaded=false}
  var h=(location.hash||'').slice(1);
  if(h&&valid(h))route=h;else if(!valid(route))route='home';
  render({keep:true});notify();
}
async function persist(next){
  var up=await db.from('hn_site').upsert({id:'main',data:{v:1,site:next.site,lore:next.lore},updated_at:new Date().toISOString()}).select('id');
  if(up.error)throw up.error;
  if(!up.data||!up.data.length)throw new Error('ditolak');
  var keep={};
  var list=next.chapters.filter(function(c){return !c.example});
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var row={title:c.title,volume:c.vol||null,chapter_number:(c.n==null||isNaN(c.n))?null:c.n,content:c.body,status:c.status==='draft'?'draft':'published'};
    if(!dbIds[c.id]){
      row.slug=slugFor(c.title);
      var ins=await db.from('chapters').insert(row).select('id,slug').single();
      if(ins.error)throw ins.error;
      c.id=ins.data.id;c.slug=ins.data.slug;dbIds[c.id]=1;
    }else{
      var old=S.chapters.find(function(x){return x.id===c.id});
      if(!old||old.title!==c.title||(old.vol||'')!==(c.vol||'')||old.n!==c.n||old.body!==c.body||(old.status||'published')!==(c.status||'published')){
        var u=await db.from('chapters').update(row).eq('id',c.id).select('id');
        if(u.error)throw u.error;
        if(!u.data||!u.data.length)throw new Error('ditolak');
      }
    }
    keep[c.id]=1;
  }
  var ids=Object.keys(dbIds);
  for(var j=0;j<ids.length;j++){
    if(!keep[ids[j]]){
      var dl=await db.from('chapters').delete().eq('id',ids[j]).select('id');
      if(dl.error)throw dl.error;
      delete dbIds[ids[j]];
    }
  }
  next.chapters=next.chapters.filter(function(c){return c.example||keep[c.id]});
}
async function commit(fn,okMsg){
  if(!db||!canEdit){toast('Masuk sebagai Author dulu lewat tombol AUTHOR ACCESS.');return false}
  if(!dbLoaded){toast('Data belum termuat dari database. Muat ulang halaman, lalu coba lagi.');return false}
  var next=clone(S);fn(next);
  if(JSON.stringify({site:next.site,lore:next.lore}).length>6000000){toast('Data terlalu besar. Kecilkan gambar atau hapus beberapa.');return false}
  busy(true,'Menyimpan ke database...');
  try{
    await persist(next);
    S=next;closeModal();busy(false);render({keep:true});notify();toast(okMsg||'Tersimpan');
    return true;
  }catch(e){
    console.error(e);busy(false);
    var m=String((e&&e.message)||e);
    toast(m==='ditolak'||(e&&e.code==='42501')?'Ditolak database. Pastikan kamu masih login sebagai Author dan aturan RLS sudah dipasang.':'Gagal menyimpan: '+m);
    await loadContent();
    return false;
  }
}

/* ---------- content cleaning ---------- */
var FLAT={DIV:1,SECTION:1,ARTICLE:1,BODY:1,TABLE:1,TBODY:1,THEAD:1,TFOOT:1,TR:1,TD:1,TH:1,FIGURE:1,MAIN:1,CENTER:1,HEADER:1,FOOTER:1,ASIDE:1,NAV:1,DL:1,DD:1,DT:1};
var SKIP={SCRIPT:1,STYLE:1,IMG:1,SVG:1,IFRAME:1,OBJECT:1,EMBED:1,NOSCRIPT:1,CANVAS:1,VIDEO:1,AUDIO:1,HEAD:1,TITLE:1,META:1,LINK:1};
function inlineNode(c){
  if(c.nodeType===3)return esc(c.nodeValue.replace(/ /g,' '));
  if(c.nodeType!==1)return '';
  var tg=c.tagName;
  if(SKIP[tg])return '';
  if(tg==='BR')return '<br>';
  var inner=inlineChildren(c);
  if(tg==='STRONG'||tg==='B')return inner.trim()?'<strong>'+inner+'</strong>':inner;
  if(tg==='EM'||tg==='I')return inner.trim()?'<em>'+inner+'</em>':inner;
  if(tg==='U')return inner.trim()?'<u>'+inner+'</u>':inner;
  var st=(c.getAttribute&&c.getAttribute('style'))||'';
  if(tg==='SPAN'&&inner.trim()){
    var b=/font-weight\s*:\s*(bold|[6-9]00)/i.test(st),it=/font-style\s*:\s*italic/i.test(st);
    if(b)inner='<strong>'+inner+'</strong>';if(it)inner='<em>'+inner+'</em>';
  }
  return inner;
}
function inlineChildren(n){var o='';for(var i=0;i<n.childNodes.length;i++)o+=inlineNode(n.childNodes[i]);return o}
function blank(h){return !h.replace(/<br>|&nbsp;|\s/g,'')}
function blocksOf(node,out){
  var buf='';
  function flush(){if(!blank(buf))out.push('<p>'+buf.trim()+'</p>');buf=''}
  for(var i=0;i<node.childNodes.length;i++){
    var c=node.childNodes[i];
    if(c.nodeType===3){buf+=esc(c.nodeValue.replace(/ /g,' '));continue}
    if(c.nodeType!==1)continue;
    var tg=c.tagName;
    if(SKIP[tg])continue;
    if(tg==='P'){flush();var h=inlineChildren(c).trim();if(!blank(h))out.push('<p>'+h+'</p>')}
    else if(/^H[1-6]$/.test(tg)){flush();var hh=inlineChildren(c).replace(/<\/?(strong|em|u)>/g,'').trim();if(!blank(hh)){var k=(tg==='H1'||tg==='H2')?'h2':'h3';out.push('<'+k+'>'+hh+'</'+k+'>')}}
    else if(tg==='BLOCKQUOTE'){flush();var q=[];blocksOf(c,q);if(q.length)out.push('<blockquote>'+q.join('')+'</blockquote>')}
    else if(tg==='UL'||tg==='OL'){flush();var l=tg.toLowerCase(),items='';for(var j=0;j<c.children.length;j++){if(c.children[j].tagName==='LI'){var li=inlineChildren(c.children[j]).trim();if(!blank(li))items+='<li>'+li+'</li>'}}if(items)out.push('<'+l+'>'+items+'</'+l+'>')}
    else if(tg==='HR'){flush();out.push('<hr>')}
    else if(FLAT[tg]){flush();blocksOf(c,out)}
    else buf+=inlineNode(c);
  }
  flush();
}
function cleanHtml(html){
  var d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),out=[];
  blocksOf(d.body,out);
  return out.join('');
}
function textToHtml(t){
  t=String(t).replace(/\r\n?/g,'\n').trim();
  var heads=function(line){return esc(line).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')};
  var blocks=/\n\s*\n/.test(t)?t.split(/\n\s*\n/):t.split('\n');
  var wrapped=/\n\s*\n/.test(t);
  return blocks.map(function(b){
    b=b.trim();if(!b)return '';
    var m=b.match(/^(#{1,3})\s+(.+)$/);
    if(m)return '<h2>'+heads(m[2])+'</h2>';
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(b))return '<hr>';
    return '<p>'+heads(wrapped?b.replace(/\s*\n\s*/g,' '):b)+'</p>';
  }).join('');
}

/* ---------- chapter splitting ---------- */
var HEADRE=/^\s*((bab|chapter|bagian|part)\s+(\d+|[ivxlcdm]+)\b|(prolog|prologue|epilog|epilogue|interlude|intermezzo)\b)/i;
function splitChapters(html,fallback){
  var d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),kids=[].slice.call(d.body.children);
  function isHead(el){
    if(el.tagName==='H2')return true;
    if(el.tagName==='P'){var t=el.textContent.trim();return t.length>0&&t.length<=80&&HEADRE.test(t)}
    return false;
  }
  var chunks=[],cur=null,pre=[];
  kids.forEach(function(el){
    if(isHead(el)){cur={title:el.textContent.trim().replace(/\s+/g,' '),parts:[]};chunks.push(cur)}
    else if(cur)cur.parts.push(el.outerHTML);
    else pre.push(el.outerHTML);
  });
  var res=[];
  if(!chunks.length){return [{title:fallback,html:pre.join('')}]}
  if(textOf(pre.join('')).trim().length>200)res.push({title:fallback,html:pre.join('')});
  chunks.forEach(function(c){var h=c.parts.join('');if(textOf(h).trim().length)res.push({title:c.title,html:h})});
  if(!res.length)res.push({title:fallback,html:''});
  res.forEach(function(c){var m=c.title.match(/(?:bab|chapter)\s*(\d+)/i);if(m)c.n=+m[1];c.title=c.title.replace(/^\s*(?:bab|chapter)\s*\d+\s*[:.\-–—]?\s*/i,'').trim()||c.title});
  return res;
}

/* ---------- libraries & file parsing ---------- */
var LIBS={mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'},LIBP={};
function loadLib(k){
  if(LIBP[k])return LIBP[k];
  LIBP[k]=new Promise(function(res,rej){var s=document.createElement('script');s.src=LIBS[k];s.onload=res;s.onerror=function(){LIBP[k]=null;rej(new Error('lib'))};document.head.appendChild(s)});
  return LIBP[k];
}
async function pdfToHtml(file){
  await loadLib('pdf');
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  var lines=[],p,it,cur;
  for(p=1;p<=doc.numPages;p++){
    var pg=await doc.getPage(p),tc=await pg.getTextContent();cur=null;
    for(var i=0;i<tc.items.length;i++){
      it=tc.items[i];if(typeof it.str!=='string')continue;
      var x=it.transform[4],y=it.transform[5],h=it.height||Math.abs(it.transform[3])||10;
      if(cur&&Math.abs(cur.y-y)<Math.max(2,h*.4)){
        var gap=x-cur.ex;
        if(gap>h*.2&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str))cur.t+=' ';
        cur.t+=it.str;cur.ex=x+(it.width||0);
      }else{if(cur)lines.push(cur);cur={t:it.str,x:x,y:y,h:h,p:p,ex:x+(it.width||0)}}
    }
    if(cur)lines.push(cur);
  }
  lines=lines.filter(function(l){return l.t.trim()});
  if(!lines.length)throw new Error('empty');
  var xs=lines.filter(function(l){return l.t.length>35}).map(function(l){return l.x}).sort(function(a,b){return a-b});
  var margin=xs.length?xs[Math.floor(xs.length*.25)]:lines[0].x;
  var gaps=[];for(var k=1;k<lines.length;k++){if(lines[k].p===lines[k-1].p){var g=lines[k-1].y-lines[k].y;if(g>0)gaps.push(g)}}
  gaps.sort(function(a,b){return a-b});var lh=gaps.length?gaps[Math.floor(gaps.length/2)]:14;
  var out=[],buf='';
  function push(){var t=buf.trim();buf='';if(!t)return;out.push((t.length<=80&&HEADRE.test(t))?'<h2>'+esc(t)+'</h2>':'<p>'+esc(t)+'</p>')}
  for(k=0;k<lines.length;k++){
    var L=lines[k],t=L.t.trim(),prev=lines[k-1];
    if(/^\d{1,4}$/.test(t))continue;
    var np=!buf;
    if(!np&&HEADRE.test(t)&&t.length<=80)np=true;
    if(!np&&HEADRE.test(buf.trim())&&buf.trim().length<=80)np=true;
    if(!np&&prev&&prev.p===L.p&&(prev.y-L.y)>lh*1.5)np=true;
    if(!np&&L.x-margin>L.h*.9&&/[.!?…"”’)]$/.test(buf.trim()))np=true;
    if(np){push();buf=t}
    else if(/[a-zà-ÿ]-$/.test(buf)&&/^[a-z]/.test(t))buf=buf.slice(0,-1)+t;
    else buf+=' '+t;
  }
  push();
  return out.join('');
}
async function fileToChunks(file){
  var ext=(file.name.split('.').pop()||'').toLowerCase(),base=file.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim()||'Bab baru',html='';
  if(ext==='docx'){
    await loadLib('mammoth');
    var r=await window.mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()},{convertImage:window.mammoth.images.imgElement(function(){return Promise.resolve({src:''})})});
    html=cleanHtml(r.value);
  }else if(ext==='pdf'){html=await pdfToHtml(file)}
  else if(ext==='txt'||ext==='md'||ext==='markdown'){html=textToHtml(await file.text())}
  else if(ext==='html'||ext==='htm'){html=cleanHtml(await file.text())}
  else throw new Error('type');
  return splitChapters(html,base);
}

async function handleImport(files){
  var out=document.getElementById('imp-out'),save=document.getElementById('imp-save');
  out.innerHTML='<p class="hint" style="margin-top:14px">Membaca file...</p>';
  files=[].slice.call(files).sort(function(a,b){return a.name.localeCompare(b.name,'id',{numeric:true})});
  var all=[],errs=[];
  for(var i=0;i<files.length;i++){
    try{var ch=await fileToChunks(files[i]);ch.forEach(function(c){c.file=files[i].name;all.push(c)})}
    catch(e){errs.push(files[i].name+(e&&e.message==='type'?' (format belum didukung, simpan sebagai .docx atau .pdf)':e&&e.message==='empty'?' (PDF ini tidak berisi teks yang bisa dibaca, mungkin hasil scan)':' (gagal dibaca)'))}
  }
  impChunks=all.filter(function(c){return textOf(c.html).trim()});
  var start=nextNum(),used=0;
  var h='';
  if(errs.length)h+='<p class="hint" style="color:var(--red);margin-top:14px">Tidak terbaca: '+esc(errs.join('; '))+'</p>';
  if(!impChunks.length){out.innerHTML=h||'<p class="hint">Tidak ada isi yang bisa diimpor.</p>';save.hidden=true;return}
  h+='<div class="f" style="margin-top:14px"><label for="imp-vol">Volume atau arc untuk semua bab ini (opsional)</label><input class="in" id="imp-vol" maxlength="60"></div><div class="imp-list">';
  impChunks.forEach(function(c,i){
    var n=c.n!=null?c.n:start+used;if(c.n==null)used++;
    h+='<div class="imp-row" data-i="'+i+'"><input type="checkbox" data-k="on" checked aria-label="Sertakan"><input class="in" data-k="t" value="'+esc(c.title)+'" aria-label="Judul"><input class="in" data-k="n" type="number" value="'+n+'" aria-label="Nomor"><small>'+fmt(wordCount(c.html))+' kata &middot; '+esc(c.file)+'</small></div>';
  });
  out.innerHTML=h+'</div><p class="hint">Ditemukan '+impChunks.length+' bab. Ubah judul atau nomor sebelum menambahkan.</p>';
  save.hidden=false;
}

function readImage(file,max,q){
  return new Promise(function(res,rej){
    if(/svg/.test(file.type)){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file);return}
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}

  border: 1px solid #B99A61;
  border-radius: 8px;
  background: #F7E6C2;
  color: #2A1B12;
  box-shadow: 0 18px 60px #0008;
}

.hn-author-card h2 {
  margin-top: 0;
  font-family: Metamorphous, Georgia, serif;
}

.hn-author-card input {
  box-sizing: border-box;
  width: 100%;
  margin: 8px 0 14px;
  padding: 12px;
  border: 1px solid #D3A96C;
  border-radius: 4px;
  background: #FFF7E3;
  color: #2A1B12;
  font: inherit;
}

.hn-author-card button {
  padding: 11px 14px;
  border: 0;
  border-radius: 4px;
  background: #14232A;
  color: #EBD9B4;
  font: inherit;
  cursor: pointer;
}

.hn-author-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#hn-author-message {
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.6;
}

/* Writer Studio: tambahan agar dashboard muat dan terbaca */
#hn-author-modal {
  overflow-y: auto;
  align-items: start;
}

.hn-author-card:has(#hn-author-dashboard:not([hidden])) {
  width: min(100%, 640px);
  margin: auto;
}

.hn-author-card textarea {
  box-sizing: border-box;
  width: 100%;
  margin: 8px 0 14px;
  padding: 12px;
  border: 1px solid #D3A96C;
  border-radius: 4px;
  background: #FFF7E3;
  color: #2A1B12;
  font: inherit;
  resize: vertical;
}

.hn-writer-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 14px 0;
}

.hn-writer-stats div {
  padding: 10px;
  border: 1px solid #D3A96C;
  border-radius: 4px;
  text-align: center;
}

.hn-writer-stats span {
  display: block;
  font-size: 11px;
}

.hn-writer-stats strong {
  font-size: 22px;
}

.hn-chapter-card {
  margin-bottom: 10px;
  padding: 12px;
  border: 1px solid #D3A96C;
  border-radius: 4px;
  background: #FFF7E3;
}

.hn-chapter-card h4,
.hn-chapter-card p {
  margin: 0 0 4px;
}
</style>

<button data-keep id="hn-author-access" type="button">
  AUTHOR ACCESS
</button>

<div data-keep id="hn-author-modal" hidden>
  <section class="hn-author-card">
    <h2>Hollow Night</h2>
    <p id="hn-author-subtitle">AUTHOR ARCHIVE // RESTRICTED ACCESS</p>

    <form id="hn-author-form">
      <label for="hn-author-email">Author Email</label>
      <input
        id="hn-author-email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="hn-author-password">Password</label>
      <input
        id="hn-author-password"
        type="password"
        autocomplete="current-password"
        required
      >

      <div class="hn-author-actions">
        <button type="submit">ENTER ARCHIVE</button>
        <button type="button" id="hn-author-close">CLOSE</button>
      </div>
    </form>

    <p id="hn-author-message" role="status" aria-live="polite"></p>
    <div id="hn-author-dashboard" hidden>

      <div class="hn-writer-header">
        <p>HOLLOW NIGHT // AUTHOR MODE</p>
        <h2>Author's Archive</h2>
        <p>Edit langsung dari tiap halaman. Di sini kamu mengatur daftar chapter dan status terbitnya.</p>
      </div>

      <div class="hn-writer-stats">
        <div><span>Total Chapters</span><strong id="hn-stat-total">0</strong></div>
        <div><span>Drafts</span><strong id="hn-stat-drafts">0</strong></div>
        <div><span>Published</span><strong id="hn-stat-published">0</strong></div>
      </div>

      <div class="hn-author-actions">
        <button type="button" id="hn-author-newchapter">NEW CHAPTER</button>
        <button type="button" id="hn-author-modetoggle">EDIT TOOLS: ON</button>
      </div>

      <hr>

      <h3>CHAPTER ARCHIVE</h3>
      <p id="hn-chapter-message" role="status" aria-live="polite"></p>

      <div id="hn-chapter-list">
        <p>Chapter archive will appear here.</p>
      </div>

      <button type="button" id="hn-author-logout">
        SIGN OUT
      </button>

    </div>
  </section>
</div>

<script data-keep>
(() => {
  const AUTHOR_UID = "6c3958f1-ee85-47e6-836a-f1db260bc3cc";
  const db = window.hnSupabase;

  const button = document.getElementById("hn-author-access");
  const modal = document.getElementById("hn-author-modal");
  const form = document.getElementById("hn-author-form");
  const message = document.getElementById("hn-author-message");
  const dashboard = document.getElementById("hn-author-dashboard");
  const subtitle = document.getElementById("hn-author-subtitle");
  const emailInput = document.getElementById("hn-author-email");
  const passwordInput = document.getElementById("hn-author-password");
  const chapterList = document.getElementById("hn-chapter-list");
  const toggleBtn = document.getElementById("hn-author-modetoggle");

  if (!db) {
    button.addEventListener("click", () => {
      alert("Supabase belum siap. Periksa koneksi dan urutan script.");
    });
    return;
  }

  const api = () => window.hnApp;

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function syncToggle() {
    const on = api() && api().isAdmin();
    toggleBtn.textContent = on ? "EDIT TOOLS: ON" : "EDIT TOOLS: OFF";
  }

  function renderArchive() {
    const app = api();
    if (!app) {
      chapterList.innerHTML = "<p>Memuat chapter...</p>";
      return;
    }
    const chapters = app.chapters();
    document.getElementById("hn-stat-total").textContent = chapters.length;
    document.getElementById("hn-stat-drafts").textContent =
      chapters.filter(c => c.status === "draft").length;
    document.getElementById("hn-stat-published").textContent =
      chapters.filter(c => c.status === "published").length;
    syncToggle();

    if (!chapters.length) {
      chapterList.innerHTML =
        "<p>Belum ada chapter. Tekan NEW CHAPTER untuk mulai menulis.</p>";
      return;
    }

    chapterList.innerHTML = chapters.map(c => `
      <article class="hn-chapter-card">
        <h4>${escapeHTML(c.title)}</h4>
        <p>
          ${escapeHTML(c.vol || "No volume")}
          ${c.n ? " — Chapter " + escapeHTML(c.n) : ""}
        </p>
        <p>Status: <strong>${c.status === "draft" ? "draft" : "published"}</strong></p>
        <div class="hn-author-actions">
          <button type="button" data-hn-act="edit" data-id="${escapeHTML(c.id)}">EDIT</button>
          <button type="button" data-hn-act="pub" data-id="${escapeHTML(c.id)}">${c.status === "draft" ? "PUBLISH" : "UNPUBLISH"}</button>
          <button type="button" data-hn-act="del" data-id="${escapeHTML(c.id)}">DELETE</button>
        </div>
      </article>
    `).join("");
  }

  function showLoggedOut() {
    form.hidden = false;
    dashboard.hidden = true;
    subtitle.textContent = "AUTHOR ARCHIVE // RESTRICTED ACCESS";
    button.textContent = "AUTHOR ACCESS";
    passwordInput.value = "";
  }

  async function updateSessionUI() {
    const { data, error } = await db.auth.getSession();

    if (error) {
      message.textContent = "Gagal memeriksa sesi. Silakan coba lagi.";
      return;
    }

    const user = data.session?.user;

    if (user && user.id === AUTHOR_UID) {
      form.hidden = true;
      dashboard.hidden = false;
      subtitle.textContent = "IDENTITY VERIFIED";
      button.textContent = "AUTHOR MODE";
      message.textContent = "Akun Author berhasil diverifikasi.";
      renderArchive();
    } else {
      showLoggedOut();
    }
  }

  button.addEventListener("click", async () => {
    modal.hidden = false;
    await updateSessionUI();
  });

  document.getElementById("hn-author-close")
    .addEventListener("click", () => { modal.hidden = true; });

  modal.addEventListener("click", event => {
    if (event.target === modal) modal.hidden = true;
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    message.textContent = "Memverifikasi identitas...";

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      message.textContent =
        "Login gagal. Periksa email, password, dan konfigurasi Auth.";
      return;
    }

    if (data.user?.id !== AUTHOR_UID) {
      await db.auth.signOut();
      showLoggedOut();
      message.textContent = "Akses ditolak. Akun ini bukan Author Hollow Night.";
      return;
    }

    passwordInput.value = "";
    message.textContent = "Identitas berhasil diverifikasi.";
    await updateSessionUI();
  });

  document.getElementById("hn-author-logout")
    .addEventListener("click", async () => {
      message.textContent = "Keluar...";

      try {
        // scope "local": hapus sesi di browser ini tanpa bergantung pada server
        const { error } = await db.auth.signOut({ scope: "local" });
        if (error) console.warn("signOut:", error.message);
      } catch (err) {
        console.warn("signOut gagal:", err);
      }

      // Pastikan token tersimpan benar-benar hilang
      try {
        Object.keys(localStorage)
          .filter(k => /^sb-.*-auth-token/.test(k))
          .forEach(k => localStorage.removeItem(k));
      } catch (err) {}

      showLoggedOut();
      message.textContent = "Kamu sudah keluar dari Author Archive.";
      location.reload();
    });

  document.getElementById("hn-author-newchapter")
    .addEventListener("click", () => {
      modal.hidden = true;
      api()?.create();
    });

  toggleBtn.addEventListener("click", () => {
    api()?.toggleAdmin();
    syncToggle();
  });

  chapterList.addEventListener("click", event => {
    const b = event.target.closest("[data-hn-act]");
    if (!b || !api()) return;
    const id = b.dataset.id;
    const act = b.dataset.hnAct;
    if (act === "edit") {
      modal.hidden = true;
      api().edit(id);
    } else if (act === "pub") {
      api().togglePublish(id);
    } else if (act === "del") {
      if (confirm("Hapus chapter ini secara permanen?")) api().remove(id);
    }
  });

  // Dipicu aplikasi setiap kali data/sesi berubah
  document.addEventListener("hn-state", () => {
    const isAuthor = !!(api() && api().isAuthor());
    button.textContent = isAuthor ? "AUTHOR MODE" : "AUTHOR ACCESS";
    if (!dashboard.hidden) {
      if (isAuthor) renderArchive();
      else showLoggedOut();
    }
  });
})();
</script>

</body></html>
