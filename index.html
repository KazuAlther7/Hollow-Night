/* Hollow Night v2.1 — Morphing Top Bar & Fixed Toolbars */
.rt{border:0;background:transparent;overflow:visible;display:flex;flex-direction:column;gap:12px}
.rt-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);border:1px solid var(--paper-edge);border-radius:12px;box-shadow:0 5px 18px rgba(0,0,0,.13);padding:10px;background:var(--paper);gap:5px;z-index:15}
.rt-bar[data-mode="image"]{border:1px solid var(--gold);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.16);background:var(--paper)}
.rt-area{background:var(--field);border:1px solid var(--paper-edge);border-radius:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.04);min-height:420px;position:relative;display:flow-root}
.editor-page .rt-bar{top:calc(env(safe-area-inset-top,0px) + 12px)}
@media(max-width:680px){.rt-bar{top:calc(env(safe-area-inset-top,0px) + 12px);padding:7px}.rt-area{padding:14px;min-height:360px}.img-group{max-width:100%;height:auto;min-height:38px;flex-wrap:wrap}.img-slider input[type=range]{width:78px}}

/* Morphing Top Bar Styles */
body.is-editing .top { pointer-events: none; }
body.is-editing .top .bar { pointer-events: auto; width: fit-content; margin: 0 auto; padding: 6px 12px; gap: 12px; border-radius: 999px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
body.is-editing .brand, body.is-editing .tabs { display: none; }
body.is-editing .top { top: calc(env(safe-area-inset-top,0px) + 12px); position: fixed; left: 50%; transform: translateX(-50%); width: auto; z-index: 50; }
body.is-editing .morph-menu-btn { display: flex !important; }
body.is-editing .admin-tools { display: flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 999px; }
body:not(.is-editing) .admin-tools { display: flex; align-items: center; gap: 8px; }
.morph-menu-btn { display: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 0; color: var(--night-ink); cursor: pointer; }
.morph-menu-btn:hover { background: rgba(255,255,255,0.2); }

/* Floating Action Buttons */
.hn-float-btn { position: fixed; z-index: 100; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-family: var(--f-ui); transition: transform 0.2s; }
.hn-float-btn:hover { transform: translateY(-2px); }
#hn-back-btn { bottom: 24px; left: 24px; background: var(--paper); color: var(--ink); border: 2px solid var(--paper-edge); padding: 10px 18px; font-size: 0.9rem; }
#hn-format-btn { bottom: 24px; right: 24px; background: #8b5cf6; color: white; border: 0; width: 56px; height: 56px; padding: 0; }
#hn-format-btn svg { width: 24px; height: 24px; }

/* Text Wrapping Fixes */
.rt-area figure { display: block; margin: 1em 0; }
.rt-area img[data-wrap="wrap"], .rt-area img[data-wrap="tight"], .rt-area img[data-wrap="through"] { float: left; margin: 0.5em 1.5em 0.5em 0; }
.rt-area img[data-align="right"][data-wrap="wrap"], .rt-area img[data-align="right"][data-wrap="tight"], .rt-area img[data-align="right"][data-wrap="through"] { float: right; margin: 0.5em 0 0.5em 1.5em; }

<title>Hollow Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Metamorphous&family=Nunito:wght@400;600;700;800&display=swap">
<style id="hn-style">
:root{
  --bg:#E9BE82; --paper:#F7E6C2; --paper-edge:#D3A96C; --field:#FFF7E3;
  --ink:#2A1B12; --ink-soft:#684931; --line:rgba(42,27,18,.2);
  --night:#14232A; --night-ink:#EBD9B4; --gold:#F2C14E;
  --red:#B3372B; --on-red:#FFF4E0; --pine:#2D6A55;
  --tape:rgba(242,193,78,.62);
  --shadow:0 2px 0 rgba(42,27,18,.12),0 12px 24px -14px rgba(42,27,18,.55);
  --sky1:#0F1C28; --sky2:#1B3A3C; --p1:#1D4B42; --p2:#143832; --p3:#0B2523;
  --f-display:'Metamorphous',Georgia,'Times New Roman',serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-read:'Literata',Georgia,'Times New Roman',serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
    --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
    --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
    --tape:rgba(242,193,78,.34);
    --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
  --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
  --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
  --tape:rgba(242,193,78,.34);
  --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-ui);
  padding-block:0 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.14),transparent 45%),radial-gradient(circle at 90% 100%,rgba(0,0,0,.12),transparent 40%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--bg-scene,none);
  background-size:cover;background-position:center bottom;background-repeat:no-repeat;
  opacity:.13;transition:opacity .5s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::after{opacity:.3}
}
:root[data-theme="dark"] body::after{opacity:.3}
:root[data-theme="light"] body::after{opacity:.13}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-weight:700;font-size:1.3em;line-height:1.1}

.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:12px;max-width:1120px;margin:0 auto;transition:all .4s ease}
.bar{position:relative;display:flex;align-items:center;gap:8px;background:var(--night);color:var(--night-ink);border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);overflow:visible;transition:all .4s ease}

.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{background:rgba(242,193,78,.18);color:var(--gold)}
.adm{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(235,217,180,.4);background:transparent;color:var(--night-ink);border-radius:999px;padding:7px 12px;font:800 .78rem/1 var(--f-ui)}
.adm svg{width:16px;height:16px}
.adm[aria-pressed="true"]{background:var(--gold);color:#1B1208;border-color:var(--gold)}
.adm.saveall{background:var(--gold);color:#1B1208;border-color:var(--gold);animation:hnGlow 2s ease-in-out infinite}
@keyframes hnGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.5)}50%{box-shadow:0 0 0 6px rgba(242,193,78,0)}}

@media (max-width:760px){
  .bar{flex-wrap:wrap}
  .tabs{order:3;flex:1 0 100%}
  .brand{margin-right:auto}
  .brand img{height:32px}
}
.save-indicator{
  flex:none;display:flex;align-items:center;justify-content:center;
  min-height:38px;padding:0 10px;border-radius:999px;
  background:rgba(0,0,0,.18);border:1.5px solid rgba(235,217,180,.18);
}

}

.save-light.dirty::after{border-color:rgba(239,68,68,.45)}
@keyframes hnPulseLight{0%,100%{opacity:1}50%{opacity:.45}}

.menu-wrap{position:relative;flex:none}
.menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:transparent;border:0;color:var(--night-ink);cursor:pointer;transition:background .15s}
.menu-btn:hover{background:rgba(255,255,255,.08)}
.menu-btn[aria-expanded="true"]{background:rgba(242,193,78,.18);color:var(--gold)}
.menu-btn svg{width:20px;height:20px}
.menu-pop{position:absolute;top:calc(100% + 10px);right:0;min-width:250px;background:var(--paper);color:var(--ink);border:1px solid var(--paper-edge);border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.35),0 2px 0 rgba(42,27,18,.1);padding:8px;z-index:60}
.menu-pop[hidden]{display:none}
.menu-head{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font:400 1.05rem/1.2 var(--f-display)}
.menu-head small{color:var(--ink-soft);font-size:.78rem;font-weight:600}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;background:transparent;border:0;color:inherit;text-decoration:none;font:700 .88rem/1.3 var(--f-ui);cursor:pointer;text-align:left;transition:background .12s}
.menu-item:hover{background:rgba(42,27,18,.07)}
.menu-item svg{width:18px;height:18px;flex:none;color:var(--ink-soft)}
.menu-item small{display:block;color:var(--ink-soft);font-weight:600;font-size:.74rem;margin-top:1px}
.menu-sep{height:1px;margin:6px 8px;background:var(--line)}

main.shell{padding-block:22px 28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border-radius:10px;border:2px solid transparent;font:800 .92rem/1.1 var(--f-ui);text-decoration:none;background:var(--red);color:var(--on-red);box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:#1B1208}
.btn.nightghost{background:transparent;color:var(--night-ink);border-color:rgba(235,217,180,.55);box-shadow:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.8rem}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.sheet{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:22px}
.sheet.taped::before,.card.taped::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border:1px solid rgba(0,0,0,.06)}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.ph h1{font-size:clamp(1.9rem,5vw,2.8rem);margin-top:6px}
.ph .sub{font-family:var(--f-hand);font-weight:600;font-size:1.35rem;color:var(--ink-soft);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:36px 16px}
.empty .hand{font-size:1.7rem}

.stamp{display:inline-block;font:700 1.05rem/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:4px;padding:2px 8px;transform:rotate(-5deg);letter-spacing:.04em}
.chip{display:inline-block;font:800 .68rem/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:5px 9px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.filters .in{max-width:280px}
button.chip{background:transparent}

.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--night);color:var(--night-ink);box-shadow:var(--shadow);isolation:isolate}
.scene{position:absolute;inset:0;z-index:-1}
.scn{width:100%;height:100%;display:block}
.scn .l1{fill:var(--p1)}.scn .l2{fill:var(--p2)}.scn .l3{fill:var(--p3)}
.scn .gnd{fill:var(--p3)}
.ff{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:#FFE58A;box-shadow:0 0 10px 3px rgba(255,229,138,.7);animation:drift var(--t) ease-in-out var(--d) infinite}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(16px,-22px);opacity:1}}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:38px 18px 110px}
.logo-big{width:min(560px,88%);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.tag{font:700 clamp(1.3rem,3.4vw,1.8rem)/1.15 var(--f-hand);color:var(--gold);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.rollout{min-height:2.4em;font:700 1.15rem/1.2 var(--f-hand);color:var(--night-ink);max-width:40ch}

.d20{transition:transform .5s}
.d20.spin{animation:spin .7s ease}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;margin-top:34px;align-items:start}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

.nb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:34px}
.nbi{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s}
.nbi:hover{transform:translateY(-3px) rotate(-.6deg)}
.nbi svg{width:30px;height:30px;color:var(--red)}
.nbi b{font:400 1.15rem/1.1 var(--f-display)}
.nbi span{font:700 1.1rem/1.1 var(--f-hand);color:var(--ink-soft)}
.desk{margin-top:26px;border-style:dashed}
.desk h2{font-size:1.25rem;margin-bottom:6px}

.vol{margin:26px 0 8px;font:400 1.2rem/1 var(--f-display);display:flex;align-items:center;gap:12px}
.vol::after{content:"";flex:1;border-top:2px dotted var(--ink-soft)}
.toc{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.rowlink{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-decoration:none}
.rowlink:hover .rt-title{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.hex{display:grid;place-items:center;width:44px;height:48px;background:var(--night);color:var(--gold);font:400 1.05rem/1 var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rt-title{font:400 1.12rem/1.2 var(--f-display)}
.rt-meta{font:600 .82rem/1.3 var(--f-ui);color:var(--ink-soft);margin-top:3px}
.done{font:700 1.05rem/1 var(--f-hand);color:var(--pine)}
.rowact{display:flex;gap:6px;padding-right:12px;flex-wrap:wrap}
@media (max-width:520px){.row{flex-wrap:wrap}.rowact{padding:0 16px 12px}}

.rd-wrap{max-width:720px;margin:0 auto}
.rd-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px}
.reader{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:clamp(22px,5vw,52px) clamp(18px,5vw,56px)}
.reader header{text-align:center;margin-bottom:30px}
.reader header h1{font-size:clamp(1.7rem,5vw,2.4rem);margin-top:10px}
.orn{display:block;margin:14px auto 0;width:150px;height:14px;color:var(--red)}
.body{font-family:var(--f-read);font-size:var(--fs,18px);line-height:1.85;hyphens:auto;overflow-wrap:break-word;position:relative;display:flow-root}
.body p{margin:0 0 1.05em}
.reader .body>p:first-child::first-letter{float:left;font:400 3.5em/.82 var(--f-display);padding:.07em .1em 0 0;color:var(--red)}
.body h2{font-size:1.35em;margin:1.6em 0 .6em;text-align:center}
.body h3{font-size:1.15em;margin:1.4em 0 .5em}
.body blockquote{margin:1.2em 0;padding:.2em 0 .2em 1.1em;border-left:4px solid var(--red);font-style:italic;color:var(--ink-soft)}
.body hr{border:0;height:1.6em;text-align:center;margin:1.2em 0}
.body hr::after{content:"*  *  *";letter-spacing:.4em;color:var(--red);font-family:var(--f-display)}
.body ul,.body ol{padding-left:1.4em;margin:0 0 1.05em}
.rd-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:26px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);text-decoration:none;overflow:hidden;transition:transform .15s}
.grid>.card:nth-child(3n+1){transform:rotate(-.5deg)}
.grid>.card:nth-child(3n){transform:rotate(.45deg)}
.card:hover{transform:translateY(-4px) rotate(0)}
.card .ph-img{aspect-ratio:16/10;background:var(--night);display:block;width:100%;object-fit:cover}
.card .noimg{aspect-ratio:16/7;display:grid;place-items:center;background:var(--night);color:var(--gold);position:relative}
.card .noimg svg{width:38px;height:38px}
.card .cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.25rem}
.card .sum{color:var(--ink-soft);font-size:.95rem}

function view(){

}
function searchBox(ph){return '<input class="in q" type="search" id="q" placeholder="'+ph+'" aria-label="'+ph+'">'}

function initials(n){return esc(String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase())}
function portrait(e){return '<div class="portrait">'+(e.img?'<img src="'+e.img+'" alt="">':initials(e.title))+'</div>'}
function mod(v){var m=Math.floor((v-10)/2);return (m>=0?'+':'')+m}

function makeSlug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,120)}
function slugFor(t){return (makeSlug(t)||'bab')+'-'+Math.random().toString(36).slice(2,6)}
function rowToCh(r){
  var raw=String(r.content||'');
  var body=/<(p|h2|h3|blockquote|hr|br|div)\b/i.test(raw)?cleanHtml(raw):textToHtml(raw);
  return {id:String(r.id),slug:r.slug,n:r.chapter_number==null?0:r.chapter_number,vol:r.volume||'',title:r.title,body:body,status:r.status==='published'?'published':'draft',t:Date.parse(r.created_at)||0};
}
function notify(){try{document.dispatchEvent(new CustomEvent('hn-state'))}catch(e){}}
async function loadContent(){
  if(!db)return;
  try{
    var sq=await db.from('hn_site').select('data').eq('id','main').maybeSingle();
    var q=db.from('chapters').select('id,title,slug,volume,chapter_number,content,status,created_at').order('created_at',{ascending:true});
    if(!canEdit)q=q.eq('status','published');
    var cq=await q;
    if(sq.error)console.warn('hn_site:',sq.error.message);
    if(cq.error)console.warn('chapters:',cq.error.message);
    var hasRow=!!(sq.data&&sq.data.data);
    if(hasRow){
      var d=sq.data.data;
      S.site=d.site||{tagline:'',synopsis:'',author:'',avatar:'',logos:{home:'',top:''}};
      S.site.avatar=S.site.avatar||'';
      S.site.logos=S.site.logos||{home:'',top:''};
      S.lore=d.lore||[];
      S.novels=d.novels||[];
    }
    if(!cq.error){
      var rows=cq.data||[];dbIds={};rows.forEach(function(r){dbIds[r.id]=1});
      if(rows.length||hasRow)S.chapters=rows.map(rowToCh);
    }
    migrateNovels();
    dbLoaded=!sq.error&&!cq.error;
  }catch(e){console.error(e);dbLoaded=false}
  var h=(location.hash||'').slice(1);
  if(h&&valid(h))route=h;else if(!valid(route))route='home';
  render({keep:true});notify();
}
async function persist(next){
  if(!db)throw new Error('no db');
  var keep={};
  var idMap={};
  var list=next.chapters.filter(function(c){return !c.example});
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var row={title:c.title,volume:c.vol||null,chapter_number:(c.n==null||isNaN(c.n))?null:c.n,content:c.body,status:c.status==='draft'?'draft':'published'};
    if(!dbIds[c.id]){
      var oldId=c.id;
      row.slug=slugFor(c.title);
      var ins=await db.from('chapters').insert(row).select('id,slug').single();
      if(ins.error)throw ins.error;
      var newId=String(ins.data.id);
      idMap[oldId]=newId;
      c.id=newId;
      if(ins.data.slug)c.slug=ins.data.slug;
      dbIds[newId]=1;
    }else{
      var old=S.chapters.find(function(x){return x.id===c.id});
      if(!old||old.title!==c.title||(old.vol||'')!==(c.vol||'')||old.n!==c.n||old.body!==c.body||(old.status||'published')!==(c.status||'published')){
        var u=await db.from('chapters').update(row).eq('id',c.id).select('id');
        if(u.error)throw u.error;
        if(!u.data||!u.data.length)throw new Error('ditolak');
      }
    }
    keep[c.id]=1;
  }
  var ids=Object.keys(dbIds);
  for(var j=0;j<ids.length;j++){
    if(!keep[ids[j]]){
      var dl=await db.from('chapters').delete().eq('id',ids[j]).select('id');
      if(dl.error)throw dl.error;
      delete dbIds[ids[j]];
    }
  }
  (next.novels||[]).forEach(function(n){
    n.chapterIds=(n.chapterIds||[]).map(function(id){return idMap[id]||id}).filter(function(id){return keep[id]||next.chapters.some(function(c){return c.id===id&&c.example;})});
  });
  var up=await db.from('hn_site').upsert({id:'main',data:{v:1,site:next.site,lore:next.lore,novels:next.novels},updated_at:new Date().toISOString()}).select('id');
  if(up.error)throw up.error;
  if(!up.data||!up.data.length)throw new Error('ditolak');
  next.chapters=next.chapters.filter(function(c){return c.example||keep[c.id]});
}
async function persistNow(){
  if(!db||!canEdit)return false;
  busy(true,'Menyimpan ke database...');
  try{
    await persist(S);
    pendingSave=false;
    busy(false);render({keep:true});notify();
    toast('Perubahan tersimpan');
    return true;
  }catch(e){
    busy(false);
    console.error(e);
    var m=String((e&&e.message)||e);
    toast(m==='ditolak'||(e&&e.code==='42501')?'Ditolak database ('+(e&&e.code||'RLS')+').':'Gagal menyimpan: '+m);
    return false;
  }
}
function stageOrCommit(fn,okMsg){
  var next=clone(S);
  try{fn(next)}catch(err){console.error(err);toast('Perubahan gagal diproses: '+(err&&err.message||err));return Promise.resolve(false)}
  if(JSON.stringify({site:next.site,lore:next.lore,novels:next.novels}).length>6000000){toast('Data terlalu besar. Kecilkan gambar atau hapus beberapa.');return Promise.resolve(false)}
  S=next;
  if(autoSave){
    return persistNow().then(function(ok){
      if(ok){closeModal();render({keep:true});notify();toast(okMsg||'Tersimpan')}
      else{render({keep:true});notify()}
      return ok;
    });
  }else{
    pendingSave=true;
    closeModal();render({keep:true});notify();
    toast((okMsg||'Perubahan disiapkan')+' — jangan lupa tekan Simpan');
    return Promise.resolve(true);
  }
}
function commit(fn,okMsg){
  if(!db||!canEdit){toast('Masuk sebagai Author dulu lewat tombol AUTHOR ACCESS.');return Promise.resolve(false)}
  if(!dbLoaded){toast('Data belum termuat dari database. Muat ulang halaman, lalu coba lagi.');return Promise.resolve(false)}
  return stageOrCommit(fn,okMsg);
}
async function saveChapterFromPage(){
  var btn=document.querySelector('[data-act="ch-save-page"]');
  if(!btn)return;
  var cid=btn.getAttribute('data-id');
  var c=cid?chById(cid):null;
  var title=c?c.title:val('ce-t').trim();
  var body=readRich('ce-b');
  var n=c?c.n:(parseInt(val('ce-n'),10)||0);
  var vol=c?(c.vol||''):val('ce-v').trim();
  var st=c?(c.status||'draft'):(val('ce-st')==='published'?'published':'draft');
  var novelId=c?(novelOf(cid)||{}).id:val('ce-novel');
  if(!title){toast('Isi judul bab dulu.');return}
  if(!textOf(body).trim()){toast('Isi bab masih kosong.');return}
  if(!novelId){toast('Pilih novel dulu.');return}
  var tempId=uid('c');
  var next=clone(S);
  if(c){
    var t=next.chapters.find(function(x){return x.id===c.id});
    if(!t){toast('Bab tidak ditemukan.');return}
    t.body=body;
    delete t.example;
  }else{
    next.chapters.push({id:tempId,title:title,n:n,vol:vol,body:body,status:st,t:Date.now()});
    var nv=next.novels.find(function(x){return x.id===novelId});
    if(nv)nv.chapterIds=(nv.chapterIds||[]).concat(tempId);
  }
  S=next;
  if(!db||!canEdit){pendingSave=true;toast('Perubahan disiapkan (belum login).');go('n-'+novelId);return}
  busy(true,'Menyimpan bab...');
  try{
    await persist(S);
    pendingSave=false;
    busy(false);
    toast('Bab tersimpan');
    go('n-'+novelId);
  }catch(e){
    busy(false);console.error(e);
    toast('Gagal menyimpan: '+((e&&e.message)||e));
    render({keep:true});
  }
}
async function saveNovelFromPage(){
  var btn=document.querySelector('[data-act="novel-save-page"]');
  if(!btn)return;
  var nid=btn.getAttribute('data-id');
  var title=val('ne-t').trim();
  if(!title){toast('Isi judul novel dulu.');return}
  var data={
    title:title,
    author:val('ne-a').trim(),
    genre:val('ne-g').trim(),
    status:val('ne-st'),
    tagline:val('ne-tag').trim(),

    document.body.appendChild(ov);

function positionImageOverlay(){
  var ov=document.getElementById('hn-img-overlay');
  if(!ov){return}
  if(!ieImg){ov.remove();return}
  var r=ieImg.getBoundingClientRect();
  ov.style.left=r.left+'px';
  ov.style.top=r.top+'px';
  ov.style.width=r.width+'px';
  ov.style.height=r.height+'px';
}
function bindOverlayHandles(){
  var ov=document.getElementById('hn-img-overlay');
  if(!ov||ov.__bound)return;
  ov.__bound=true;
  ov.addEventListener('pointerdown',function(ev){
    var h=ev.target.closest('.hn-h');if(!h||!ieImg)return;
    ev.preventDefault();
    var type=h.getAttribute('data-h');
    var r=ieImg.getBoundingClientRect();
    if(type==='rot'){
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var startAngle=Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI;
      var rot0=parseFloat(ieImg.getAttribute('data-rotate')||'0')||0;
      function mv(e){
        var ang=Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI;
        var deg=Math.round(rot0+(ang-startAngle));
        deg=((deg+180)%360+360)%360-180;
        ieImg.setAttribute('data-rotate',deg);
        applyImageStyle();syncImageToolbarFromState();positionImageOverlay();
      }
      function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)}
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    } else {
      var startX=ev.clientX, startW=r.width;
      var leftSide=(type==='nw'||type==='sw');
      var origPct=parseFloat(ieImg.getAttribute('data-size')||'100')||100;
      function mv(e){
        var dx=e.clientX-startX;
        var newW=startW+(leftSide?-dx:dx);
        if(newW<24)newW=24;
        var pct=clamp(Math.round(newW/startW*origPct),5,100);
        ieImg.setAttribute('data-size',pct+'%');
        applyImageStyle();
        setVal('ie-size',pct);setTxt('ie-sizev',pct+'%');
        positionImageOverlay();
      }
      function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)}
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    }
  });
}

function applyImageStyle(){
  if(!ieImg)return;
  var img=ieImg;
  var wrap=img.getAttribute('data-wrap')||'none';
  var align=img.getAttribute('data-align')||'center';
  var bw=parseFloat(img.getAttribute('data-border')||'0')||0;
  var bc=img.getAttribute('data-border-color')||'#B3372B';
  var round=parseFloat(img.getAttribute('data-round')||'6')||0;
  var shadow=img.getAttribute('data-shadow')||'0';
  var rot=parseFloat(img.getAttribute('data-rotate')||'0')||0;
  var ox=parseFloat(img.getAttribute('data-offset-x')||'0')||0;
  var oy=parseFloat(img.getAttribute('data-offset-y')||'0')||0;
  var sizeVal=img.getAttribute('data-size');
  var opVal=img.getAttribute('data-opacity');

  // Visual
  img.style.border = bw>0 ? (bw+'px solid '+bc) : '';
  img.style.borderRadius = round>=999 ? '50%' : (round>0?round+'px':'6px');
  img.style.boxShadow = shadow==='1' ? '0 4px 12px rgba(0,0,0,.25)' : shadow==='2' ? '0 10px 30px rgba(0,0,0,.5)' : '';
  img.style.opacity = opVal || '';
  img.style.maxWidth = '100%';
  img.style.height = 'auto';
  img.style.transform = 'translate('+ox+'px,'+oy+'px) rotate('+rot+'deg)';
  img.style.transformOrigin = 'center center';
  img.style.width = sizeVal || '';

  // Reset layout
  img.style.cssFloat = 'none';
  img.style.display = 'block';
  img.style.verticalAlign = '';
  img.style.margin = '1em auto';
  img.style.position = '';

  // Wrap mode
  if(wrap==='inline'){
    img.style.display = 'inline-block';
    img.style.verticalAlign = 'middle';
    img.style.margin = '0 4px';
    img.style.cssFloat = 'none';
    if(!sizeVal) img.style.width = 'auto';
  } else if(wrap==='wrap'||wrap==='tight'||wrap==='through'){
    img.style.display = 'block';
    if(align==='left'){ img.style.cssFloat='left'; img.style.margin='0.5em 1.5em 0.5em 0'; }
    else if(align==='right'){ img.style.cssFloat='right'; img.style.margin='0.5em 0 0.5em 1.5em'; }
    else { img.style.cssFloat='none'; img.style.margin='1em auto'; }
    if(!sizeVal) img.style.width = '40%';
  } else if(wrap==='behind'||wrap==='front'){
    img.style.position = 'absolute';
    img.style.zIndex = wrap==='front' ? '10' : '0';
    img.style.cssFloat = 'none';
    img.style.display = 'block';
    if(align==='left'){ img.style.left='4%'; img.style.right='auto'; }
    else if(align==='right'){ img.style.left='auto'; img.style.right='4%'; }
    else { img.style.left='50%'; img.style.right='auto'; img.style.transform='translate(calc(-50% + '+ox+'px),'+oy+'px) rotate('+rot+'deg)'; }
    img.style.top = '20%';
    if(!sizeVal) img.style.width = '50%';
    if(wrap==='behind' && !opVal) img.style.opacity = '0.55';
  } else { // none / top-bottom
    img.style.display = 'block';
    if(align==='left') img.style.margin = '1em auto 1em 0';
    else if(align==='right') img.style.margin = '1em 0 1em auto';
    else img.style.margin = '1em auto';
  }

  positionImageOverlay();
}

function bindImageDrag(){
  if(!ieImg)return;

  img.addEventListener('pointerdown',function(ev){

    var ox0=parseFloat(img.getAttribute('data-offset-x')||'0')||0;
    var oy0=parseFloat(img.getAttribute('data-offset-y')||'0')||0;
    imgDragState={startX:ev.clientX,startY:ev.clientY,ox0:ox0,oy0:oy0,img:img};
    img.classList.add('dragging');
    try{img.setPointerCapture(ev.pointerId)}catch(e){}
  });
  img.addEventListener('pointermove',function(ev){
    if(!imgDragState||imgDragState.img!==img)return;
    ev.preventDefault();
    var nx=Math.round(imgDragState.ox0+ev.clientX-imgDragState.startX);
    var ny=Math.round(imgDragState.oy0+ev.clientY-imgDragState.startY);
    nx=clamp(nx,-500,500);ny=clamp(ny,-500,500);
    img.setAttribute('data-offset-x',nx);
    img.setAttribute('data-offset-y',ny);
    applyImageStyle();
    setVal('ie-ox',nx);setTxt('ie-oxv',nx);
    setVal('ie-oy',ny);setTxt('ie-oyv',ny);
  });
  function end(){if(imgDragState&&imgDragState.img===img){img.classList.remove('dragging');imgDragState=null;positionImageOverlay();}}
  img.addEventListener('pointerup',end);
  img.addEventListener('pointercancel',end);
}

async function uploadImage(file){
  if(!db||!canEdit)throw new Error('login');
  var data=await readImage(file,1600,.82);
  var blob=await (await fetch(data)).blob();
  var ext=blob.type==='image/svg+xml'?'svg':(blob.type==='image/png'?'png':'jpg');
  var path='chapters/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  var up=await db.storage.from('chapter-images').upload(path,blob,{contentType:blob.type,upsert:false});
  if(up.error)throw up.error;
  return db.storage.from('chapter-images').getPublicUrl(path).data.publicUrl;
}

  }
}

function readImage(file,max,q){
  return new Promise(function(res,rej){
    if(file.type === 'image/png' || file.type === 'image/svg+xml' || file.type === 'image/webp'){
      var fr = new FileReader();
      fr.onload = function(){ res(fr.result) };
      fr.onerror = rej;
      fr.readAsDataURL(file);
      return;
    }
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}

async function handleImport(files){
  var out=document.getElementById('imp-out'),save=document.getElementById('imp-save');
  out.innerHTML='<p class="hint" style="margin-top:14px">Membaca file...</p>';
  files=[].slice.call(files).sort(function(a,b){return a.name.localeCompare(b.name,'id',{numeric:true})});
  var all=[],errs=[];
  for(var i=0;i<files.length;i++){
    try{var ch=await fileToChunks(files[i]);ch.forEach(function(c){c.file=files[i].name;all.push(c)})}
    catch(e){errs.push(files[i].name+(e&&e.message==='type'?' (format belum didukung, simpan sebagai .docx atau .pdf)':e&&e.message==='empty'?' (PDF ini tidak berisi teks yang bisa dibaca, mungkin hasil scan)':' (gagal dibaca)'))}
  }
  impChunks=all.filter(function(c){return textOf(c.html).trim()});
  var start=1,used=0;
  var nSel=document.getElementById('imp-novel');
  if(nSel){var nv=novel(nSel.value);if(nv)start=nextNumForNovel(nv.id)}
  var h='';
  if(errs.length)h+='<p class="hint" style="color:var(--red);margin-top:14px">Tidak terbaca: '+esc(errs.join('; '))+'</p>';
  if(!impChunks.length){out.innerHTML=h||'<p class="hint">Tidak ada isi yang bisa diimpor.</p>';save.hidden=true;return}
  h+='<div class="imp-list" style="margin-top:14px">';
  impChunks.forEach(function(c,i){
    var n=c.n!=null?c.n:start+used;if(c.n==null)used++;
    h+='<div class="imp-row" data-i="'+i+'"><input type="checkbox" data-k="on" checked aria-label="Sertakan"><input class="in" data-k="t" value="'+esc(c.title)+'" aria-label="Judul"><input class="in" data-k="n" type="number" value="'+n+'" aria-label="Nomor"><small>'+fmt(wordCount(c.html))+' kata &middot; '+esc(c.file)+'</small></div>';
  });
  out.innerHTML=h+'</div><p class="hint">Ditemukan '+impChunks.length+' bab. Ubah judul atau nomor sebelum menambahkan.</p>';
  save.hidden=false;
}

  const passwordInput = document.getElementById("hn-author-password");
  const chapterList = document.getElementById("hn-chapter-list");
  const toggleBtn = document.getElementById("hn-author-modetoggle");
  if (!db) {
    button.addEventListener("click", () => { alert("Supabase belum siap. Periksa koneksi dan urutan script."); });
    return;
  }
  const api = () => window.hnApp;
  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  }
  function syncToggle() {
    const on = api() && api().isAdmin();
    toggleBtn.textContent = on ? "EDIT TOOLS: ON" : "EDIT TOOLS: OFF";
  }
  function renderArchive() {
    const app = api();
    if (!app) { chapterList.innerHTML = "<p>Memuat chapter...</p>"; return; }
    const chapters = app.chapters();
    document.getElementById("hn-stat-total").textContent = chapters.length;
    document.getElementById("hn-stat-drafts").textContent = chapters.filter(c => c.status === "draft").length;
    document.getElementById("hn-stat-published").textContent = chapters.filter(c => c.status === "published").length;
    syncToggle();
    if (!chapters.length) { chapterList.innerHTML = "<p>Belum ada chapter. Tekan NEW CHAPTER untuk mulai menulis.</p>"; return; }
    chapterList.innerHTML = chapters.map(c => `
      <article class="hn-chapter-card">
        <h4>${escapeHTML(c.title)}</h4>
        <p>${escapeHTML(c.vol || "No volume")}${c.n ? " — Chapter " + escapeHTML(c.n) : ""}</p>
        <p>Status: <strong>${c.status === "draft" ? "draft" : "published"}</strong></p>
        <div class="hn-author-actions">
          <button type="button" data-hn-act="edit" data-id="${escapeHTML(c.id)}">EDIT</button>
          <button type="button" data-hn-act="pub" data-id="${escapeHTML(c.id)}">${c.status === "draft" ? "PUBLISH" : "UNPUBLISH"}</button>
          <button type="button" data-hn-act="del" data-id="${escapeHTML(c.id)}">DELETE</button>
        </div>
      </article>
    `).join("");
  }
  function showLoggedOut() {
    form.hidden = false; dashboard.hidden = true;
    subtitle.textContent = "AUTHOR ARCHIVE // RESTRICTED ACCESS";
    button.textContent = "AUTHOR ACCESS";
    passwordInput.value = "";
  }
  async function updateSessionUI() {
    const { data, error } = await db.auth.getSession();
    if (error) { message.textContent = "Gagal memeriksa sesi. Silakan coba lagi."; return; }
    const user = data.session?.user;
    if (user && user.id === AUTHOR_UID) {
      form.hidden = true; dashboard.hidden = false;
      subtitle.textContent = "IDENTITY VERIFIED";
      button.textContent = "AUTHOR MODE";
      message.textContent = "Akun Author berhasil diverifikasi.";
      renderArchive();
    } else { showLoggedOut(); }
  }
  button.addEventListener("click", async () => { modal.hidden = false; await updateSessionUI(); });
  document.getElementById("hn-author-close").addEventListener("click", () => { modal.hidden = true; });
  modal.addEventListener("click", event => { if (event.target === modal) modal.hidden = true; });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    message.textContent = "Memverifikasi identitas...";
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { message.textContent = "Login gagal. Periksa email, password, dan konfigurasi Auth."; return; }
    if (data.user?.id !== AUTHOR_UID) {
      await db.auth.signOut(); showLoggedOut();
      message.textContent = "Akses ditolak. Akun ini bukan Author Hollow Night.";
      return;
    }
    passwordInput.value = "";
    message.textContent = "Identitas berhasil diverifikasi.";
    await updateSessionUI();
  });
  document.getElementById("hn-author-logout").addEventListener("click", async () => {
    message.textContent = "Keluar...";
    try { const { error } = await db.auth.signOut({ scope: "local" }); if (error) console.warn("signOut:", error.message); } catch (err) { console.warn("signOut gagal:", err); }
    try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (err) {}
    showLoggedOut();
    message.textContent = "Kamu sudah keluar dari Author Archive.";
    location.reload();
  });
  document.getElementById("hn-author-newchapter").addEventListener("click", () => { modal.hidden = true; api()?.create(); });
  toggleBtn.addEventListener("click", () => { api()?.toggleAdmin(); syncToggle(); });
  chapterList.addEventListener("click", event => {
    const b = event.target.closest("[data-hn-act]");
    if (!b || !api()) return;
    const id = b.dataset.id;
    const act = b.dataset.hnAct;
    if (act === "edit") { modal.hidden = true; api().edit(id); }
    else if (act === "pub") { api().togglePublish(id); }
    else if (act === "del") { if (confirm("Hapus chapter ini secara permanen?")) api().remove(id); }
  });
  document.addEventListener("hn-state", () => {
    const isAuthor = !!(api() && api().isAuthor());
    button.textContent = isAuthor ? "AUTHOR MODE" : "AUTHOR ACCESS";
    if (!dashboard.hidden) {
      if (isAuthor) renderArchive();
      else showLoggedOut();
    }
  });
})();
</script>

</body></html>
