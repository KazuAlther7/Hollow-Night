<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hollow Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Metamorphous&family=Nunito:wght@400;600;700;800&display=swap">
<style id="hn-style">
:root{
  --bg:#E9BE82; --paper:#F7E6C2; --paper-edge:#D3A96C; --field:#FFF7E3;
  --ink:#2A1B12; --ink-soft:#684931; --line:rgba(42,27,18,.2);
  --night:#14232A; --night-ink:#EBD9B4; --gold:#F2C14E;
  --red:#B3372B; --on-red:#FFF4E0; --pine:#2D6A55;
  --tape:rgba(242,193,78,.62);
  --shadow:0 2px 0 rgba(42,27,18,.12),0 12px 24px -14px rgba(42,27,18,.55);
  --sky1:#0F1C28; --sky2:#1B3A3C; --p1:#1D4B42; --p2:#143832; --p3:#0B2523;
  --f-display:'Metamorphous',Georgia,'Times New Roman',serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-read:'Literata',Georgia,'Times New Roman',serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
    --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
    --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
    --tape:rgba(242,193,78,.34);
    --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17110D; --paper:#261C14; --paper-edge:#46341F; --field:#1D1510;
  --ink:#F2E0BC; --ink-soft:#BFA27C; --line:rgba(242,224,188,.2);
  --night:#0B1418; --red:#E2604F; --on-red:#1A0F0B; --pine:#6CC0A5;
  --tape:rgba(242,193,78,.34);
  --shadow:0 2px 0 rgba(0,0,0,.35),0 12px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-ui);
  padding-block:0 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.14),transparent 45%),radial-gradient(circle at 90% 100%,rgba(0,0,0,.12),transparent 40%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--bg-scene,none);
  background-size:cover;background-position:center bottom;background-repeat:no-repeat;
  opacity:.13;transition:opacity .5s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::after{opacity:.3}
}
:root[data-theme="dark"] body::after{opacity:.3}
:root[data-theme="light"] body::after{opacity:.13}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1120px;margin:0 auto}
.hand{font-family:var(--f-hand);font-weight:700;font-size:1.3em;line-height:1.1}
.kicker{font:800 .72rem/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:12px;max-width:1120px;margin:0 auto}
.bar{position:relative;display:flex;align-items:center;gap:8px;background:var(--night);color:var(--night-ink);border-radius:16px;padding:6px 10px;box-shadow:var(--shadow);overflow:visible}
.brand{display:block;flex:none;padding:4px 6px}
.brand img{display:block;height:38px;width:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;color:var(--night-ink);text-decoration:none;font:700 .88rem/1 var(--f-ui);white-space:nowrap;transition:background .15s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{background:rgba(242,193,78,.18);color:var(--gold)}
.adm{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(235,217,180,.4);background:transparent;color:var(--night-ink);border-radius:999px;padding:7px 12px;font:800 .78rem/1 var(--f-ui)}
.adm svg{width:16px;height:16px}
.adm[aria-pressed="true"]{background:var(--gold);color:#1B1208;border-color:var(--gold)}
.adm.saveall{background:var(--gold);color:#1B1208;border-color:var(--gold);animation:hnGlow 2s ease-in-out infinite}
.adm.savestatus{opacity:.9;cursor:default}
@keyframes hnGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.5)}50%{box-shadow:0 0 0 6px rgba(242,193,78,0)}}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0;border-radius:0 0 16px 16px}
@media (max-width:760px){
  .bar{flex-wrap:wrap}
  .tabs{order:3;flex:1 0 100%}
  .brand{margin-right:auto}
  .brand img{height:32px}
}
.save-light{
  display:inline-block;width:11px;height:11px;border-radius:50%;
  background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.75);
  flex:none;margin:0 4px;transition:background .35s,box-shadow .35s;
  position:relative;
}
.save-light::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(74,222,128,.35)}
.save-light.dirty{background:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.85);animation:hnPulseLight 1.6s ease-in-out infinite}
.save-light.dirty::after{border-color:rgba(239,68,68,.45)}
@keyframes hnPulseLight{0%,100%{opacity:1}50%{opacity:.45}}

.menu-wrap{position:relative;flex:none}
.menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:transparent;border:0;color:var(--night-ink);cursor:pointer;transition:background .15s}
.menu-btn:hover{background:rgba(255,255,255,.08)}
.menu-btn[aria-expanded="true"]{background:rgba(242,193,78,.18);color:var(--gold)}
.menu-btn svg{width:20px;height:20px}
.menu-pop{position:absolute;top:calc(100% + 10px);right:0;min-width:250px;background:var(--paper);color:var(--ink);border:1px solid var(--paper-edge);border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.35),0 2px 0 rgba(42,27,18,.1);padding:8px;z-index:60}
.menu-pop[hidden]{display:none}
.menu-head{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font:400 1.05rem/1.2 var(--f-display)}
.menu-head small{color:var(--ink-soft);font-size:.78rem;font-weight:600}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;background:transparent;border:0;color:inherit;text-decoration:none;font:700 .88rem/1.3 var(--f-ui);cursor:pointer;text-align:left;transition:background .12s}
.menu-item:hover{background:rgba(42,27,18,.07)}
.menu-item svg{width:18px;height:18px;flex:none;color:var(--ink-soft)}
.menu-item small{display:block;color:var(--ink-soft);font-weight:600;font-size:.74rem;margin-top:1px}
.menu-sep{height:1px;margin:6px 8px;background:var(--line)}

main.shell{padding-block:22px 28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border-radius:10px;border:2px solid transparent;font:800 .92rem/1.1 var(--f-ui);text-decoration:none;background:var(--red);color:var(--on-red);box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:#1B1208}
.btn.nightghost{background:transparent;color:var(--night-ink);border-color:rgba(235,217,180,.55);box-shadow:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.8rem}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.sheet{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:22px}
.sheet.taped::before,.card.taped::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border:1px solid rgba(0,0,0,.06)}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.ph h1{font-size:clamp(1.9rem,5vw,2.8rem);margin-top:6px}
.ph .sub{font-family:var(--f-hand);font-weight:600;font-size:1.35rem;color:var(--ink-soft);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:36px 16px}
.empty .hand{font-size:1.7rem}
.empty p{max-width:46ch;margin:8px auto 18px;color:var(--ink-soft)}
.stamp{display:inline-block;font:700 1.05rem/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:4px;padding:2px 8px;transform:rotate(-5deg);letter-spacing:.04em}
.chip{display:inline-block;font:800 .68rem/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:5px 9px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.filters .in{max-width:280px}
button.chip{background:transparent}

.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--night);color:var(--night-ink);box-shadow:var(--shadow);isolation:isolate}
.scene{position:absolute;inset:0;z-index:-1}
.scn{width:100%;height:100%;display:block}
.scn .l1{fill:var(--p1)}.scn .l2{fill:var(--p2)}.scn .l3{fill:var(--p3)}
.scn .gnd{fill:var(--p3)}
.ff{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:#FFE58A;box-shadow:0 0 10px 3px rgba(255,229,138,.7);animation:drift var(--t) ease-in-out var(--d) infinite}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(16px,-22px);opacity:1}}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:38px 18px 110px}
.logo-big{width:min(560px,88%);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.tag{font:700 clamp(1.3rem,3.4vw,1.8rem)/1.15 var(--f-hand);color:var(--gold);max-width:36ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.rollout{min-height:2.4em;font:700 1.15rem/1.2 var(--f-hand);color:var(--night-ink);max-width:40ch}
.rollout b{color:var(--gold);font-size:1.5em}
.d20{transition:transform .5s}
.d20.spin{animation:spin .7s ease}
@keyframes spin{to{transform:rotate(360deg)}}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;margin-top:34px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:1.45rem}
.syn p+p{margin-top:.9em}
.syn p{font-family:var(--f-read);font-size:1.02rem;line-height:1.7}
.nb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:34px}
.nbi{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s}
.nbi:hover{transform:translateY(-3px) rotate(-.6deg)}
.nbi svg{width:30px;height:30px;color:var(--red)}
.nbi b{font:400 1.15rem/1.1 var(--f-display)}
.nbi span{font:700 1.1rem/1.1 var(--f-hand);color:var(--ink-soft)}
.desk{margin-top:26px;border-style:dashed}
.desk h2{font-size:1.25rem;margin-bottom:6px}

.vol{margin:26px 0 8px;font:400 1.2rem/1 var(--f-display);display:flex;align-items:center;gap:12px}
.vol::after{content:"";flex:1;border-top:2px dotted var(--ink-soft)}
.toc{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.rowlink{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-decoration:none}
.rowlink:hover .rt-title{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.hex{display:grid;place-items:center;width:44px;height:48px;background:var(--night);color:var(--gold);font:400 1.05rem/1 var(--f-display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rt-title{font:400 1.12rem/1.2 var(--f-display)}
.rt-meta{font:600 .82rem/1.3 var(--f-ui);color:var(--ink-soft);margin-top:3px}
.done{font:700 1.05rem/1 var(--f-hand);color:var(--pine)}
.rowact{display:flex;gap:6px;padding-right:12px;flex-wrap:wrap}
@media (max-width:520px){.row{flex-wrap:wrap}.rowact{padding:0 16px 12px}}

/* Novels grid (Baca) */
.novel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px}
@media (max-width:480px){.novel-grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.novel-card{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;text-decoration:none;transition:transform .18s;display:flex;flex-direction:column}
.novel-card:hover{transform:translateY(-4px) rotate(-.3deg)}
.novel-cover{aspect-ratio:2/3;background:linear-gradient(135deg,var(--night),var(--p1) 60%,var(--p2));display:grid;place-items:center;position:relative;overflow:hidden}
.novel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.novel-cover .ph{font:700 1.3rem/1.2 var(--f-display);color:var(--gold);text-align:center;padding:18px;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.novel-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%, rgba(242,193,78,.15), transparent 60%);pointer-events:none}
.novel-meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.novel-meta h3{font:400 1.05rem/1.25 var(--f-display)}
.novel-meta .author{color:var(--ink-soft);font:700 .82rem/1.3 var(--f-ui)}
.novel-meta .cnt{color:var(--ink-soft);font:600 .78rem/1.3 var(--f-ui);margin-top:auto;padding-top:6px}
.novel-card .nbadge{position:absolute;top:8px;right:8px;z-index:2}
.novel-card .cadmin{position:absolute;bottom:8px;right:8px;z-index:2;display:flex;gap:4px}

/* Novel hero */
.novel-hero{display:grid;grid-template-columns:220px 1fr;gap:26px;margin-bottom:28px;align-items:start}
@media (max-width:640px){.novel-hero{grid-template-columns:1fr}}
.novel-hero-cover{aspect-ratio:2/3;background:linear-gradient(135deg,var(--night),var(--p1) 60%,var(--p2));border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;position:relative}
.novel-hero-cover img{width:100%;height:100%;object-fit:cover;display:block}
.novel-hero-cover .ph{font:700 1.8rem/1.2 var(--f-display);color:var(--gold);text-align:center;padding:20px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.novel-hero-info h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.novel-hero-info .author{font:700 1.25rem/1.2 var(--f-hand);color:var(--ink-soft);margin-top:8px}
.novel-hero-info .syn{font-family:var(--f-read);font-size:1.02rem;line-height:1.75;margin-top:14px}
.novel-hero-info .syn p+p{margin-top:.9em}
.novel-hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.novel-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Chapter editor page */
.ce-page{max-width:940px;margin:0 auto}
.ce-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.ce-head .back{flex:none}
.ce-head .title{flex:1;min-width:0}
.ce-head .title h1{font-size:1.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ce-head .title .kicker{margin-bottom:3px}
.ce-card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:clamp(16px,3vw,26px)}
.ce-fields{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1fr) 160px;gap:12px;margin-bottom:16px}
@media (max-width:760px){.ce-fields{grid-template-columns:1fr 1fr}.ce-fields .full{grid-column:1/-1}}
.ce-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ce-save-info{color:var(--ink-soft);font:700 .82rem/1.3 var(--f-ui);display:flex;align-items:center;gap:6px}
.ce-actions .right{display:flex;flex-wrap:wrap;gap:8px}

/* Cover picker */
.cover-pick{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.cover-pick .preview{width:150px;aspect-ratio:2/3;border:1px solid var(--paper-edge);border-radius:6px;background:var(--field);overflow:hidden;display:grid;place-items:center;flex:none}
.cover-pick .preview img{width:100%;height:100%;object-fit:cover;display:block}
.cover-pick .preview .ph{font:700 .9rem/1.3 var(--f-display);color:var(--ink-soft);text-align:center;padding:8px}

/* Reader */
.rd-wrap{max-width:720px;margin:0 auto}
.rd-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px}
.reader{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;box-shadow:var(--shadow);padding:clamp(22px,5vw,52px) clamp(18px,5vw,56px)}
.reader header{text-align:center;margin-bottom:30px}
.reader header h1{font-size:clamp(1.7rem,5vw,2.4rem);margin-top:10px}
.orn{display:block;margin:14px auto 0;width:150px;height:14px;color:var(--red)}
.body{font-family:var(--f-read);font-size:var(--fs,18px);line-height:1.85;hyphens:auto;overflow-wrap:break-word}
.body p{margin:0 0 1.05em}
.reader .body>p:first-child::first-letter{float:left;font:400 3.5em/.82 var(--f-display);padding:.07em .1em 0 0;color:var(--red)}
.body h2{font-size:1.35em;margin:1.6em 0 .6em;text-align:center}
.body h3{font-size:1.15em;margin:1.4em 0 .5em}
.body blockquote{margin:1.2em 0;padding:.2em 0 .2em 1.1em;border-left:4px solid var(--red);font-style:italic;color:var(--ink-soft)}
.body hr{border:0;height:1.6em;text-align:center;margin:1.2em 0}
.body hr::after{content:"*  *  *";letter-spacing:.4em;color:var(--red);font-family:var(--f-display)}
.body ul,.body ol{padding-left:1.4em;margin:0 0 1.05em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}

function valid(r){
  if(TABS.some(function(t){return t[0]===r}))return true;
  if(/^b-[A-Za-z0-9_-]+$/.test(r))return S.chapters.some(function(c){return 'b-'+c.id===r});
  if(/^e-[A-Za-z0-9_-]+$/.test(r))return S.lore.some(function(e){return 'e-'+e.id===r});
  if(/^n-[A-Za-z0-9_-]+$/.test(r))return S.novels.some(function(n){return 'n-'+n.id===r});
  if(/^tulis-[A-Za-z0-9_-]+$/.test(r))return S.novels.some(function(n){return 'tulis-'+n.id===r});
  if(/^edit-[A-Za-z0-9_-]+$/.test(r))return S.chapters.some(function(c){return 'edit-'+c.id===r});
  return false;
}

function saveChapterFromPage(cid,novelId){

async function persist(next){
  var up=await db.from('hn_site').upsert({id:'main',data:{v:1,site:next.site,lore:next.lore,novels:next.novels},updated_at:new Date().toISOString()}).select('id');
  if(up.error)throw up.error;
  if(!up.data||!up.data.length)throw new Error('ditolak');
  var keep={};
  var list=next.chapters.filter(function(c){return !c.example});
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var row={title:c.title,volume:c.vol||null,chapter_number:(c.n==null||isNaN(c.n))?null:c.n,content:c.body,status:c.status==='draft'?'draft':'published',novel_id:c.novelId||null};
    if(!dbIds[c.id]){
      row.slug=slugFor(c.title);
      var ins=await db.from('chapters').insert(row).select('id,slug').single();
      if(ins.error){
        if(String(ins.error.message).match(/novel_id|column.*does not exist/i)){
          delete row.novel_id;
          ins=await db.from('chapters').insert(row).select('id,slug').single();
          if(ins.error)throw ins.error;
        }else throw ins.error;
      }
      c.id=String(ins.data.id);c.slug=ins.data.slug;dbIds[c.id]=1;
    }else{
      var old=S.chapters.find(function(x){return x.id===c.id});
      var changed=!old||old.title!==c.title||(old.vol||'')!==(c.vol||'')||old.n!==c.n||old.body!==c.body||(old.status||'published')!==(c.status||'published')||(old.novelId||null)!==(c.novelId||null);
      if(changed){
        var u=await db.from('chapters').update(row).eq('id',c.id).select('id');
        if(u.error){
          if(String(u.error.message).match(/novel_id|column.*does not exist/i)){
            delete row.novel_id;
            u=await db.from('chapters').update(row).eq('id',c.id).select('id');
          }
          if(u.error)throw u.error;
        }
        if(!u.data||!u.data.length)throw new Error('ditolak');
      }
    }
    keep[c.id]=1;
  }
  var ids=Object.keys(dbIds);
  for(var j=0;j<ids.length;j++){
    if(!keep[ids[j]]){
      var dl=await db.from('chapters').delete().eq('id',ids[j]).select('id');
      if(dl.error)throw dl.error;
      delete dbIds[ids[j]];

}

var imgRange=null;
async function uploadImage(file){
  if(!db||!canEdit)throw new Error('login');
  var data=await readImage(file,1600,.82);
  var blob=await (await fetch(data)).blob();
  var ext=blob.type==='image/svg+xml'?'svg':(blob.type==='image/png'?'png':'jpg');
  var path='chapters/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  var up=await db.storage.from('chapter-images').upload(path,blob,{contentType:blob.type,upsert:false});
  if(up.error)throw up.error;
  return db.storage.from('chapter-images').getPublicUrl(path).data.publicUrl;
}
async function insertImage(file,area){
  if(!area){toast('Klik di dalam isi bab dulu.');return}
  if(file.size>15*1024*1024){toast('Gambar terlalu besar (maksimal 15 MB).');return}
  busy(true,'Mengunggah gambar...');
  try{
    var url=await uploadImage(file);
    area.focus();
    var sel=window.getSelection();
    if(imgRange&&area.contains(imgRange.commonAncestorContainer)){sel.removeAllRanges();sel.addRange(imgRange)}
    else{var r=document.createRange();r.selectNodeContents(area);r.collapse(false);sel.removeAllRanges();sel.addRange(r)}
    document.execCommand('insertHTML',false,'<figure><img src="'+esc(url)+'" alt="" data-align="center" data-wrap="none" data-round="6" data-border="0"></figure><p><br></p>');
    busy(false);toast('Gambar ditambahkan. Klik gambar untuk mengatur.');
  }catch(e){
    busy(false);console.error(e);
    var m=String((e&&e.message)||e);
    toast(/bucket/i.test(m)?'Bucket chapter-images belum dibuat.':/row-level|policy|permission|unauthor/i.test(m)?'Upload ditolak. Pastikan sudah login.':'Gagal mengunggah gambar: '+m);
  }
}
function rtCmd(cmd){
  var a=document.querySelector('.rt-area');if(a)a.focus();
  if(cmd==='bold')document.execCommand('bold');
  else if(cmd==='italic')document.execCommand('italic');
  else if(cmd==='underline')document.execCommand('underline');
  else if(cmd==='strikeThrough')document.execCommand('strikeThrough');
  else if(cmd==='sup')document.execCommand('superscript');
  else if(cmd==='sub')document.execCommand('subscript');
  else if(cmd==='undo')document.execCommand('undo');
  else if(cmd==='redo')document.execCommand('redo');
  else if(cmd==='justifyLeft')document.execCommand('justifyLeft');
  else if(cmd==='justifyCenter')document.execCommand('justifyCenter');
  else if(cmd==='justifyRight')document.execCommand('justifyRight');
  else if(cmd==='justifyFull')document.execCommand('justifyFull');
  else if(cmd==='insertUnorderedList')document.execCommand('insertUnorderedList');
  else if(cmd==='insertOrderedList')document.execCommand('insertOrderedList');
  else if(cmd==='outdent')document.execCommand('outdent');
  else if(cmd==='indent')document.execCommand('indent');
  else if(cmd==='h2'){var sel=window.getSelection(),n=sel&&sel.anchorNode;while(n&&n.nodeType!==1)n=n.parentNode;document.execCommand('formatBlock',false,(n&&n.closest&&n.closest('h2'))?'p':'h2')}
  else if(cmd==='quote')document.execCommand('formatBlock',false,'blockquote');
  else if(cmd==='hr')document.execCommand('insertHorizontalRule');
  else if(cmd==='link'){var u=prompt('Alamat tautan (https://...)','https://');if(u&&/^https?:\/\//i.test(u))document.execCommand('createLink',false,u)}
  else if(cmd==='image'){
    var sl=window.getSelection();
    imgRange=(sl&&sl.rangeCount&&a&&a.contains(sl.anchorNode))?sl.getRangeAt(0).cloneRange():null;
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=function(){if(inp.files&&inp.files[0])insertImage(inp.files[0],a)};

function rtSel(cmd,value){

  else if(cmd==='size'){document.execCommand('fontSize',false,'7');applyStyleToSelection('font-size',value+'px');document.querySelectorAll('.rt-area font[size="7"]').forEach(function(f){f.removeAttribute('size')})}

function applyStyleToSelection(prop,value){
  var sel=window.getSelection();if(!sel||!sel.rangeCount)return;
  var range=sel.getRangeAt(0);
  if(range.collapsed)return;
  var span=document.createElement('span');span.style[propToCamel(prop)]=value;
  try{range.surroundContents(span)}catch(e){var frag=range.extractContents();span.appendChild(frag);range.insertNode(span)}
  sel.removeAllRanges();var r=document.createRange();r.selectNodeContents(span);sel.addRange(r);
}

  return '<div class="f"><span class="lb">Gambar</span><div class="imgf">'+(cur?'<img id="if-prev" src="'+cur+'" alt="">':'<img id="if-prev" alt="" hidden>')+'<label class="btn ghost sm"><input id="if-file" type="file" accept="image/*" hidden>Pilih gambar</label><button class="btn ghost sm" type="button" data-act="img-clear">Hapus gambar</button></div></div>';
}
function readImage(file,max,q){
  return new Promise(function(res,rej){
    if(/svg/.test(file.type)){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file);return}
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}
function loreEditor(type,id){
  var e=id?entry(id):null,T=TYPES[type],v=function(k){return e&&e[k]!=null?e[k]:''};
  var title={world:'Judul',char:'Nama tokoh',map:'Nama peta',time:'Nama peristiwa',gloss:'Istilah'}[type];
  var h=modalHead((e?'Ubah ':'Tambah ')+T.single)+field(title,'<input class="in" id="le-t" value="'+esc(v('title'))+'" maxlength="120">','le-t');
  if(type==='world')h+=field('Kategori','<select class="in" id="le-cat">'+T.cats.map(function(c){return '<option'+(v('cat')===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>','le-cat');
  if(type==='char'){
    h+='<div class="f2">'+field('Peran','<input class="in" id="le-role" value="'+esc(v('role'))+'" placeholder="Protagonis, rival" maxlength="60">','le-role')+field('Kelas/ras','<input class="in" id="le-cls" value="'+esc(v('cls'))+'" placeholder="Ranger, Elf" maxlength="60">','le-cls')+'</div>';
    h+=field('Alignment','<select class="in" id="le-al">'+ALIGN.map(function(a){return '<option value="'+a+'"'+(v('align')===a?' selected':'')+'>'+(a||'(tidak diisi)')+'</option>'}).join('')+'</select>','le-al');
    var st=(e&&e.stats)||[];
    h+='<div class="f"><span class="lb">Statistik (1-20)</span><div class="f6">'+STATK.map(function(k,i){return '<input class="in" type="number" min="1" max="20" id="le-st'+i+'" aria-label="'+k+'" placeholder="'+k+'" value="'+(st[i]!=null?st[i]:'')+'">'}).join('')+'</div></div>';
  }
  if(type==='time'){h+='<div class="f2">'+field('Waktu','<input class="in" id="le-when" value="'+esc(v('when'))+'" placeholder="Tahun 312" maxlength="60">','le-when')+field('Urutan','<input class="in" id="le-ord" type="number" value="'+esc(e?v('ord'):(ofType('time').length+1))+'">','le-ord')+'</div>'}
  var sumLabel={world:'Ringkasan singkat',char:'Kutipan/kalimat kunci',map:'Ringkasan singkat',time:'Ringkasan singkat',gloss:'Arti/penjelasan'}[type];
  h+=field(sumLabel,'<textarea class="in" id="le-sum" rows="'+(type==='gloss'?5:3)+'">'+esc(v('summary'))+'</textarea>','le-sum');
  if(type==='world'||type==='char'||type==='map')h+=imgField(v('img'));
  if(type!=='gloss')h+='<div class="f"><span class="lb">'+(type==='char'?'Biografi':type==='map'?'Catatan':'Isi lengkap')+'</span>'+richBox('le-b',v('body'))+'</div>';
  if(type==='char')h+=field('Rahasia tokoh','<textarea class="in" id="le-sec" rows="3">'+esc(v('secret'))+'</textarea>','le-sec');
  openModal(h+modalFoot('Simpan'),{save:function(){
    var t=val('le-t').trim();if(!t){toast('Isi namanya dulu.');return}
    var data={title:t,summary:val('le-sum').trim()};
    if(type==='world')data.cat=val('le-cat');
    if(type==='char'){data.role=val('le-role').trim();data.cls=val('le-cls').trim();data.align=val('le-al');data.secret=val('le-sec').trim();data.stats=STATK.map(function(k,i){var x=val('le-st'+i);return x===''?null:clamp(parseInt(x,10)||0,1,20)});if(data.stats.every(function(x){return x==null}))data.stats=[]}
    if(type==='time'){data.when=val('le-when').trim();data.ord=parseFloat(val('le-ord'))||0}
    if(type==='world'||type==='char'||type==='map')data.img=modalImg;
    if(type!=='gloss')data.body=readRich('le-b');
    var newId=id||uid('e');
    commit(function(d){
      if(e){var x=d.lore.find(function(q){return q.id===e.id});Object.assign(x,data);delete x.example}
      else d.lore.push(Object.assign({id:newId,type:type,t:Date.now()},data));
    },'Tersimpan');
  }});

function roll(){
  var chs=chapters();if(!chs.length)return;
  var n=1+Math.floor(Math.random()*20),pick=n===20?chs[chs.length-1]:chs[Math.floor(Math.random()*chs.length)];
  var msg=n===20?'Critical hit! Kamu mendapat chapter paling baru.':n===1?'Critical fail... untung ada chapter yang menolongmu.':n>=15?'Bagus! Dadu memilihkan chapter ini.':n>=8?'Lumayan, ada yang menunggumu.':'Dadu agak malas, tapi chapter ini layak dibaca.';
  var d=document.getElementById('d20'),o=document.getElementById('rollout');
  if(d){d.classList.remove('spin');void d.offsetWidth;d.classList.add('spin')}
  if(o)o.innerHTML='<b>'+n+'</b> '+esc(msg)+' <a href="#b-'+pick.id+'" data-go="b-'+pick.id+'" style="color:var(--gold)">Baca Bab '+esc(pick.n)+'</a>';
}
var armed=null;
function armDelete(btn,fn){
  if(armed&&armed.btn===btn){clearTimeout(armed.t);armed=null;fn();return}
  if(armed){clearTimeout(armed.t);armed.btn.textContent=armed.label}
  var label=btn.textContent;btn.textContent='Yakin hapus?';
  armed={btn:btn,label:label,t:setTimeout(function(){btn.textContent=label;armed=null},3500)};
}

function isEditorDirty(){
  if(!canEdit||!route)return false;
  if(route.indexOf('tulis-')===0||route.indexOf('edit-')===0){
    var t=document.getElementById('ce-t');if(!t)return false;
    var d=readChapterFromPage(),c=route.indexOf('edit-')===0?chById(route.slice(5)):null;
    if(!c)return !!d.title||!!textOf(d.body).trim();
    return d.title!==c.title||textOf(d.body).trim()!==textOf(c.body).trim()||d.n!==c.n||(d.vol||'')!==(c.vol||'')||d.status!==(c.status||'draft');
  }
  return false;
}
document.addEventListener('click',function(ev){
  var a=ev.target.closest('[data-go]');
  if(a&&!ev.target.closest('[data-act]')){
    if(pendingSave&&!autoSave){
      if(!confirm('Ada perubahan belum disimpan. Tinggalkan halaman ini?')){ev.preventDefault();return}
      pendingSave=false;
    }
    if(isEditorDirty()){
      if(!confirm('Ada perubahan pada editor chapter yang belum disimpan. Tinggalkan?')){ev.preventDefault();return}
    }
    ev.preventDefault();closeModal();closeMenu();go(a.getAttribute('data-go'));return
  }
  var el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.id==='ov')closeModal();else if(!ev.target.closest('.menu-wrap'))closeMenu();return}
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(act){
    case 'admin':admin=!admin;lsSet('hn-admin',admin?'1':'0');pinMode=false;render({keep:true});notify();break;
    case 'save-now':if(pendingSave){persistNow()}else{toast('Semua perubahan sudah tersimpan.')}break;
    case 'roll':roll();break;
    case 'cipher':{var cx=document.getElementById('cx'),on=el.getAttribute('data-on')==='1';cx.textContent=on?el.getAttribute('data-enc'):el.getAttribute('data-dec');el.setAttribute('data-on',on?'0':'1');break}
    case 'fs':{var f=clamp((parseInt(lsGet('hn-fs')||'18',10)||18)+(+el.getAttribute('data-d'))*1,15,26);lsSet('hn-fs',String(f));var b=document.querySelector('.reader .body');if(b)b.style.setProperty('--fs',f+'px');updateProg();break}
    case 'reveal':el.classList.toggle('on');break;
    case 'cat':{document.querySelectorAll('[data-act=cat]').forEach(function(c){c.classList.toggle('on',c===el)});filterLore();break}
    /* --- NOVEL --- */
    case 'novel-new':novelEditor(null);break;
    case 'novel-edit':novelEditor(id);break;
    case 'nv-clear-cover':{modalCover='';var pv=document.getElementById('nv-prev-wrap');if(pv){pv.outerHTML='<div class="ph" id="nv-prev-wrap">Tanpa Cover</div>'};break}
    /* --- CHAPTER --- */
    case 'ch-new':go('tulis-'+(id||(S.novels[0]&&S.novels[0].id)));break;
    case 'ch-edit':go('edit-'+id);break;
    case 'ce-save':saveChapterFromPage(id||null,el.getAttribute('data-n'));break;
    case 'ce-cancel':{
      var nid=el.getAttribute('data-n')||(id?chById(id).novelId:null);
      if(isEditorDirty()){if(!confirm('Batalkan dan tinggalkan editor? Perubahan tidak disimpan.'))return}
      go(nid?'n-'+nid:'baca');
      break;
    }
    case 'ch-pub':{var pc=chById(id);if(pc){var ns=pc.status==='draft'?'published':'draft';commit(function(d){d.chapters.find(function(x){return x.id===id}).status=ns},ns==='published'?'Chapter diterbitkan':'Chapter dijadikan draft')}break}
    case 'ch-del':armDelete(el,function(){var c=chById(id),nid=c?c.novelId:null;commit(function(d){d.chapters=d.chapters.filter(function(x){return x.id!==id})},'Chapter dihapus').then(function(ok){if(ok&&nid)go('n-'+nid)});break});
    case 'import':importDialog(el.getAttribute('data-id'));break;
    case 'site-edit':siteEditor();break;
    case 'clear-ex':armDelete(el,function(){commit(function(d){d.chapters=d.chapters.filter(function(c){return !c.example});d.lore=d.lore.filter(function(e){return !e.example});d.novels=d.novels.filter(function(n){return !n.example})},'Contoh dihapus')});break;

    case 'map-click':{if(!(admin&&pinMode))break;if(ev.target.closest('.pin'))break;var r=el.getBoundingClientRect(),x=clamp((ev.clientX-r.left)/r.width*100,1,99),y=clamp((ev.clientY-r.top)/r.height*100,3,99);pinEditor(route.slice(2),-1,+x.toFixed(2),+y.toFixed(2));break}

    case 'menu':{var mp=document.getElementById('menu-pop'),open=el.getAttribute('aria-expanded')==='true';closeMenu();if(!open){mp.hidden=false;el.setAttribute('aria-expanded','true')}break}

    case 'st-save':{var th=val('st-theme');lsSet('hn-theme',th);if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);var fs=clamp(parseInt(val('st-fs'),10)||18,15,26);lsSet('hn-fs',String(fs));var rbody=document.querySelector('.reader .body');if(rbody)rbody.style.setProperty('--fs',fs+'px');var asv=val('st-as');autoSave=(asv!=='off');lsSet('hn-autosave',autoSave?'1':'0');closeModal();render({keep:true});toast('Pengaturan tersimpan. Auto-save: '+(autoSave?'AKTIF':'NONAKTIF'));break}
  }
});

  document.querySelectorAll('.rt-area img.sel').forEach(function(x){x.classList.remove('sel')});
  img.classList.add('sel');
  openImageEditor(img);
},true);
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.matches('[data-act="rt-color"]')){
    var cmd=t.getAttribute('data-cmd'),col=t.value;
    var a=document.querySelector('.rt-area');if(a)a.focus();
    document.execCommand('styleWithCSS',false,true);
    document.execCommand(cmd,false,col);
  }
  if(t.id==='q')filterLore();
  if(t.id==='ie-w'&&ieState){ieState.width=t.value+'%';var o=document.getElementById('ie-wo');if(o)o.textContent=t.value+'%';ieUpdatePreview()}
  if(t.id==='ie-o'&&ieState){ieState.opacity=(t.value/100).toString();var o2=document.getElementById('ie-oo');if(o2)o2.textContent=t.value+'%';ieUpdatePreview()}
  if(t.id==='ie-alt'&&ieState){ieState.alt=t.value}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.matches('.rt-sel')){rtSel(t.getAttribute('data-cmd'),t.value);return}
  if(t.id==='imp-file'&&t.files.length)handleImport(t.files);
  if(t.id==='if-file'&&t.files[0]){
    readImage(t.files[0],1500,.82).then(function(u){
      if(u.length>2200000){toast('Gambar masih terlalu besar.');return}
      modalImg=u;var pv=document.getElementById('if-prev');if(pv){pv.src=u;pv.hidden=false}
    }).catch(function(){toast('Gambar tidak bisa dibaca.')});
  }
  if(t.id==='pf-file'&&t.files[0]){
    readImage(t.files[0],512,.85).then(function(u){
      commit(function(d){d.site.avatar=u},'Foto profil diperbarui').then(function(){profileModal()});
    }).catch(function(){toast('Gambar tidak bisa dibaca.')});
  }
  if(t.id==='nv-file'&&t.files[0]){
    readImage(t.files[0],800,.8).then(function(u){
      if(u.length>1000000){toast('Cover terlalu besar. Pakai gambar lebih kecil.');return}
      modalCover=u;var wrap=document.getElementById('nv-prev-wrap');
      if(wrap){wrap.outerHTML='<img id="nv-prev-wrap" src="'+u+'" alt="">'}
    }).catch(function(){toast('Gambar tidak bisa dibaca.')});
  }
});
document.addEventListener('mousedown',function(ev){if(ev.target.closest('.rtb'))ev.preventDefault()});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){closeModal();closeMenu()}
  if((ev.ctrlKey||ev.metaKey)&&(ev.key==='s'||ev.key==='S')){
    if(canEdit&&(pendingSave||autoSave===false)){ev.preventDefault();persistNow()}
  }
});
document.addEventListener('paste',function(ev){
  var a=ev.target.closest&&ev.target.closest('.rt-area');if(!a)return;
  ev.preventDefault();
  var cd=ev.clipboardData,h=cd.getData('text/html'),t=cd.getData('text/plain');
  var out=h?cleanHtml(h):textToHtml(t);
  if(!out)out=textToHtml(t);
  document.execCommand('insertHTML',false,out);
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-ie]');if(!b)return;
  var k=b.getAttribute('data-ie'),v=b.getAttribute('data-v');
  if(!ieState)return;
  ieState[k]=v;
  b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
  if(k==='size'){var w=document.getElementById('ie-w');if(w&&v){w.value=parseInt(v);var o=document.getElementById('ie-wo');if(o)o.textContent=v}}
  ieUpdatePreview();
});
function filterLore(){
  var q=((document.getElementById('q')||{}).value||'').toLowerCase().trim(),c=(document.querySelector('[data-act=cat].on')||{getAttribute:function(){return ''}}).getAttribute('data-c');
  document.querySelectorAll('[data-s]').forEach(function(n){
    var ok=(!q||n.getAttribute('data-s').indexOf(q)>-1)&&(!c||n.getAttribute('data-cat')===c);
    n.hidden=!ok;
  });
  document.querySelectorAll('[data-letter]').forEach(function(h){
    var n=h.nextElementSibling,any=false;while(n&&!n.hasAttribute('data-letter')){if(!n.hidden)any=true;n=n.nextElementSibling}
    h.hidden=!any;
  });
}
var tick=false;
window.addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;updateProg()})},{passive:true});
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);
  if(h&&h!==route&&valid(h)){
    if(pendingSave&&!autoSave){
      if(!confirm('Ada perubahan belum disimpan. Tinggalkan halaman ini?')){location.hash=route;return}
      pendingSave=false;
    }
    if((route.indexOf('tulis-')===0||route.indexOf('edit-')===0)&&isEditorDirty()){
      if(!confirm('Ada perubahan pada editor chapter yang belum disimpan. Tinggalkan?')){location.hash=route;return}
    }
    pinMode=false;selPin=-1;route=h;render();
  }
});
window.addEventListener('beforeunload',function(ev){
  if(pendingSave&&!autoSave){ev.preventDefault();ev.returnValue='';return ''}
  if((route.indexOf('tulis-')===0||route.indexOf('edit-')===0)&&isEditorDirty()){ev.preventDefault();ev.returnValue='';return ''}
});
function applySession(session){
  var a=!!(session&&session.user&&session.user.id===AUTHOR_UID);
  if(session&&!a){db.auth.signOut();return}
  if(authState===a)return;
  authState=a;canEdit=a;admin=a&&lsGet('hn-admin')!=='0';
  loadContent();
}
function initDb(){
  db=window.hnSupabase||null;
  if(!db){console.warn('Supabase belum siap, memakai konten bawaan.');return}
  db.auth.onAuthStateChange(function(ev,session){setTimeout(function(){applySession(session)},0)});
  db.auth.getSession().then(function(r){applySession(r&&r.data&&r.data.session)}).catch(function(){applySession(null)});
}
window.hnApp={
  isAuthor:function(){return canEdit},
  isAdmin:function(){return admin},
  chapters:function(){return chapters().filter(function(c){return !c.example}).map(function(c){return {id:c.id,title:c.title,vol:c.vol,n:c.n,novelId:c.novelId,status:c.status==='draft'?'draft':'published'}})},
  novels:function(){return sortedNovels().filter(function(n){return !n.example}).map(function(n){return {id:n.id,title:n.title,author:n.author||'',status:n.status||'ongoing'}})},
  createNovel:function(){if(canEdit){admin=true;novelEditor(null)}},
  editNovel:function(id){if(canEdit&&novelById(id))novelEditor(id)},
  create:function(nid){if(canEdit){admin=true;go('tulis-'+(nid||(S.novels[0]&&S.novels[0].id)))}},
  edit:function(id){if(canEdit&&chById(id))go('edit-'+id)},
  togglePublish:function(id){var c=chById(id);if(!c||!canEdit)return;var ns=c.status==='draft'?'published':'draft';commit(function(d){d.chapters.find(function(x){return x.id===id}).status=ns},ns==='published'?'Chapter diterbitkan':'Chapter dijadikan draft')},
  remove:function(id){if(!canEdit)return;commit(function(d){d.chapters=d.chapters.filter(function(c){return c.id!==id})},'Chapter dihapus')},
  toggleAdmin:function(){admin=!admin;lsSet('hn-admin',admin?'1':'0');pinMode=false;render({keep:true});notify();return admin},
  save:function(){return persistNow()},
  hasPending:function(){return pendingSave},
  autoSave:function(v){if(v===undefined)return autoSave;autoSave=!!v;lsSet('hn-autosave',autoSave?'1':'0');render({keep:true});return autoSave}
};
(function(){
  var h=(location.hash||'').slice(1);
  route=h&&valid(h)?h:'home';
  var th=lsGet('hn-theme');if(th&&th!=='auto')document.documentElement.setAttribute('data-theme',th);
  applyBgScene();
  render();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initDb);else initDb();
})();
})();
</script>

<script data-keep>
(() => {
  const AUTHOR_UID = "6c3958f1-ee85-47e6-836a-f1db260bc3cc";
  const db = window.hnSupabase;
  const button = document.getElementById("hn-author-access");
  const modal = document.getElementById("hn-author-modal");
  const form = document.getElementById("hn-author-form");
  const message = document.getElementById("hn-author-message");
  const dashboard = document.getElementById("hn-author-dashboard");
  const subtitle = document.getElementById("hn-author-subtitle");
  const emailInput = document.getElementById("hn-author-email");
  const passwordInput = document.getElementById("hn-author-password");
  const chapterList = document.getElementById("hn-chapter-list");
  const toggleBtn = document.getElementById("hn-author-modetoggle");
  if (!db) {
    button.addEventListener("click", () => { alert("Supabase belum siap."); });
    return;
  }
  const api = () => window.hnApp;
  function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function syncToggle(){const on=api()&&api().isAdmin();toggleBtn.textContent=on?"EDIT TOOLS: ON":"EDIT TOOLS: OFF"}
  function renderArchive(){
    const app=api();if(!app){chapterList.innerHTML="<p>Memuat...</p>";return}
    const ns=app.novels(),cs=app.chapters();
    document.getElementById("hn-stat-novels").textContent=ns.length;
    document.getElementById("hn-stat-total").textContent=cs.length;
    document.getElementById("hn-stat-drafts").textContent=cs.filter(c=>c.status==="draft").length;
    syncToggle();
    if(!ns.length&&!cs.length){chapterList.innerHTML="<p>Belum ada novel. Tekan NEW NOVEL.</p>";return}
    let html="";
    ns.forEach(n=>{
      const nc=cs.filter(c=>c.novelId===n.id);
      html+=`<div class="hn-chapter-card" style="border-color:#B99A61"><h4 style="font-family:Metamorphous,serif">📖 ${escapeHTML(n.title)}</h4><p>${escapeHTML(n.author||"No author")} — ${nc.length} chapter</p><div class="hn-author-actions"><button type="button" data-hn-act="editnovel" data-id="${escapeHTML(n.id)}">EDIT NOVEL</button><button type="button" data-hn-act="newchap" data-id="${escapeHTML(n.id)}">+ CHAPTER</button></div></div>`;
      nc.forEach(c=>{
        html+=`<div class="hn-chapter-card" style="margin-left:16px"><h4>${escapeHTML(c.title)}</h4><p>${escapeHTML(c.vol||"No volume")}${c.n?" — Ch "+escapeHTML(c.n):""}</p><p>Status: <strong>${c.status==="draft"?"draft":"published"}</strong></p><div class="hn-author-actions"><button type="button" data-hn-act="edit" data-id="${escapeHTML(c.id)}">EDIT</button><button type="button" data-hn-act="pub" data-id="${escapeHTML(c.id)}">${c.status==="draft"?"PUBLISH":"UNPUBLISH"}</button><button type="button" data-hn-act="del" data-id="${escapeHTML(c.id)}">DELETE</button></div></div>`;
      });
    });
    chapterList.innerHTML=html;
  }
  function showLoggedOut(){form.hidden=false;dashboard.hidden=true;subtitle.textContent="AUTHOR ARCHIVE // RESTRICTED ACCESS";button.textContent="AUTHOR ACCESS";passwordInput.value=""}
  async function updateSessionUI(){
    const {data,error}=await db.auth.getSession();
    if(error){message.textContent="Gagal memeriksa sesi.";return}
    const user=data.session?.user;
    if(user&&user.id===AUTHOR_UID){form.hidden=true;dashboard.hidden=false;subtitle.textContent="IDENTITY VERIFIED";button.textContent="AUTHOR MODE";message.textContent="Akun Author berhasil diverifikasi.";renderArchive()}
    else showLoggedOut();
  }
  button.addEventListener("click",async()=>{modal.hidden=false;await updateSessionUI()});
  document.getElementById("hn-author-close").addEventListener("click",()=>{modal.hidden=true});
  modal.addEventListener("click",e=>{if(e.target===modal)modal.hidden=true});
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    message.textContent="Memverifikasi identitas...";
    const {data,error}=await db.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});
    if(error){message.textContent="Login gagal. Periksa email, password.";return}
    if(data.user?.id!==AUTHOR_UID){await db.auth.signOut();showLoggedOut();message.textContent="Akses ditolak.";return}
    passwordInput.value="";message.textContent="Identitas berhasil diverifikasi.";await updateSessionUI();
  });
  document.getElementById("hn-author-logout").addEventListener("click",async()=>{
    message.textContent="Keluar...";
    try{const {error}=await db.auth.signOut({scope:"local"});if(error)console.warn(error.message)}catch(e){}
    try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
    showLoggedOut();message.textContent="Kamu sudah keluar.";location.reload();
  });
  document.getElementById("hn-author-newnovel").addEventListener("click",()=>{modal.hidden=true;api()?.createNovel()});
  document.getElementById("hn-author-newchapter").addEventListener("click",()=>{modal.hidden=true;api()?.create()});
  toggleBtn.addEventListener("click",()=>{api()?.toggleAdmin();syncToggle()});
  chapterList.addEventListener("click",e=>{
    const b=e.target.closest("[data-hn-act]");if(!b||!api())return;
    const id=b.dataset.id,act=b.dataset.hnAct;
    if(act==="edit"){modal.hidden=true;api().edit(id)}
    else if(act==="editnovel"){modal.hidden=true;api().editNovel(id)}
    else if(act==="newchap"){modal.hidden=true;api().create(id)}
    else if(act==="pub"){api().togglePublish(id)}
    else if(act==="del"){if(confirm("Hapus chapter ini permanen?"))api().remove(id)}
  });
  document.addEventListener("hn-state",()=>{
    const isAuthor=!!(api()&&api().isAuthor());
    button.textContent=isAuthor?"AUTHOR MODE":"AUTHOR ACCESS";
    if(!dashboard.hidden){if(isAuthor)renderArchive();else showLoggedOut()}
  });
})();
</script>
